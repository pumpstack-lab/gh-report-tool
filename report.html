<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>業務日報 入力</title>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', 'Yu Gothic', sans-serif;
      background: #eef2f7;
      min-height: 100vh;
      padding-bottom: 120px;
    }

    .page-header {
      background: #4a90d9;
      color: white;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .page-header a { color: white; text-decoration: none; font-size: 26px; line-height: 1; }
    .page-header .h-info h1 { font-size: 16px; font-weight: bold; line-height: 1.3; }
    .page-header .h-info .sub { font-size: 12px; opacity: 0.85; margin-top: 2px; }

    .section {
      background: white;
      margin: 14px 16px;
      border-radius: 12px;
      padding: 16px 18px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .section-label {
      font-size: 13px;
      font-weight: bold;
      color: #4a90d9;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid #eef2f7;
    }

    .date-card-section {
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .date-card-section:active { background: #f0f6ff; }
    .date-card-inner {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
    }
    .date-card-icon { font-size: 26px; flex-shrink: 0; }
    .date-card-label { font-size: 12px; color: #7a8a9a; margin-bottom: 3px; }
    .date-card-text { font-size: 17px; font-weight: bold; color: #1a2a3a; }
    .existing-badge {
      margin-left: auto;
      font-size: 12px;
      color: #2ecc71;
      font-weight: bold;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #report-date {
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px;
      border: 0;
      pointer-events: none;
    }

    .reporter-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .reporter-row label {
      font-size: 14px;
      color: #5a6a7a;
      font-weight: bold;
      white-space: nowrap;
    }
    .reporter-input {
      flex: 1;
      padding: 11px 14px;
      border: 1.5px solid #d0d8e8;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      color: #1a2a3a;
    }
    .reporter-input:focus {
      outline: none;
      border-color: #4a90d9;
      box-shadow: 0 0 0 3px rgba(74,144,217,0.15);
    }

    .resident-entry {
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid #f0f2f5;
    }
    .resident-entry:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

    .resident-name-label {
      font-size: 15px;
      font-weight: bold;
      color: #1a2a3a;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .resident-name-label::before { content: '・'; color: #4a90d9; font-size: 20px; line-height: 1; }

    textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #d0d8e8;
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      color: #1a2a3a;
      line-height: 1.8;
      resize: none;
      overflow: hidden;
      min-height: 100px;
    }
    textarea:focus {
      outline: none;
      border-color: #4a90d9;
      box-shadow: 0 0 0 3px rgba(74,144,217,0.15);
    }
    textarea::placeholder { color: #bbc; }

    .no-residents { text-align: center; padding: 20px 0; }
    .no-residents p { color: #999; margin-bottom: 14px; }
    .btn-go-settings {
      display: inline-block;
      padding: 11px 22px;
      background: #4a90d9;
      color: white;
      border-radius: 10px;
      text-decoration: none;
      font-size: 15px;
      font-weight: bold;
    }

    .bottom-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: white;
      padding: 12px 16px 28px;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.1);
      display: flex;
      gap: 12px;
    }
    .btn-summary {
      flex: 1;
      padding: 14px;
      background: white;
      border: 2px solid #4a90d9;
      border-radius: 12px;
      color: #4a90d9;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-word {
      flex: 1;
      padding: 14px;
      background: #4a90d9;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-word:active { background: #3a7bc8; }
    .btn-summary:active { background: #f0f6ff; }

    .draft-indicator {
      font-size: 11px;
      color: #4a90d9;
      text-align: right;
      padding: 4px 16px 0;
      opacity: 0.7;
      height: 20px;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      display: flex;
      align-items: flex-end;
    }
    .modal-box {
      background: white;
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
    }
    .modal-head {
      padding: 14px 16px;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }
    .modal-head h2 { font-size: 15px; font-weight: bold; flex: 1; }
    .btn-share {
      padding: 8px 14px;
      background: #2ecc71;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .btn-share:active { background: #27ae60; }
    .btn-close {
      flex-shrink: 0;
      background: #f0f0f0;
      border: none;
      border-radius: 50%;
      width: 32px; height: 32px;
      font-size: 16px;
      cursor: pointer;
    }
    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      -webkit-overflow-scrolling: touch;
    }

    .s-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 18px; }
    .s-table td { border: 1.5px solid #333; padding: 8px 10px; vertical-align: middle; }
    .s-gh-name { text-align: center; font-size: 17px; font-weight: bold; }
    .s-sig-head { text-align: center; font-size: 11px; color: #555; background: #f8f8f8; }
    .s-sig-box { height: 44px; }
    .s-sec-title {
      font-weight: bold; font-size: 14px;
      margin: 16px 0 10px;
      padding: 6px 12px;
      background: #f0f6ff;
      border-left: 4px solid #4a90d9;
      border-radius: 0 6px 6px 0;
    }
    .s-resident { margin-bottom: 14px; }
    .s-resident .r-name { font-weight: bold; font-size: 14px; margin-bottom: 4px; }
    .s-resident .r-name::before { content: '・'; color: #4a90d9; }
    .s-resident .r-text {
      font-size: 13px; line-height: 1.8; white-space: pre-wrap;
      background: #f9f9f9; padding: 10px 14px; border-radius: 8px;
    }

    /* SHORTAGE LIST */
    .shortage-item-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .shortage-bullet { color: #4a90d9; font-size: 18px; flex-shrink: 0; }
    .shortage-item-input {
      flex: 1;
      padding: 10px 12px;
      border: 1.5px solid #d0d8e8;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      color: #1a2a3a;
    }
    .shortage-item-input:focus { outline: none; border-color: #4a90d9; }
    .btn-remove-shortage {
      width: 28px; height: 28px;
      background: #f0f0f0;
      border: none;
      border-radius: 50%;
      font-size: 14px;
      cursor: pointer;
      flex-shrink: 0;
      color: #888;
    }
    .btn-remove-shortage:active { background: #ffecec; color: #e74c3c; }
    .btn-add-shortage {
      margin-top: 8px;
      padding: 10px 16px;
      background: #f0f6ff;
      border: 1.5px dashed #4a90d9;
      border-radius: 8px;
      color: #4a90d9;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      width: 100%;
    }
    .btn-add-shortage:active { background: #e0eeff; }

    /* GH SELECTION SCREEN */
    .gh-select-screen {
      position: fixed; inset: 0;
      background: #2c3e50; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .gh-select-box {
      background: white; border-radius: 20px;
      padding: 32px 24px; width: 100%; max-width: 360px;
      text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .gh-select-box h2 {
      font-size: 18px; color: #1a2a3a; margin-bottom: 6px;
    }
    .gh-select-box p {
      font-size: 13px; color: #7a8a9a; margin-bottom: 24px;
    }
    .gh-select-btns { display: flex; flex-direction: column; gap: 10px; }
    .gh-select-btn {
      width: 100%; padding: 14px;
      background: #f0f6ff; border: 1.5px solid #c0d4f0;
      border-radius: 12px; font-size: 15px; font-weight: bold;
      color: #2c3e50; font-family: inherit; cursor: pointer;
      text-align: left; transition: all 0.12s;
    }
    .gh-select-btn:active { background: #4a90d9; color: white; border-color: #4a90d9; }
  </style>
</head>
<body>

  <!-- GH Selection Screen -->
  <div id="gh-select-screen" class="gh-select-screen" style="display:none">
    <div class="gh-select-box">
      <h2>🏠 業務日報</h2>
      <p>担当するホームを選んでください</p>
      <div class="gh-select-btns" id="gh-select-btns"></div>
    </div>
  </div>

  <div class="page-header">
    <a href="index.html">←</a>
    <div class="h-info">
      <h1 id="gh-title">ホーム</h1>
      <div class="sub" id="date-display"></div>
    </div>
  </div>

  <div class="section date-card-section" id="date-card-section">
    <div class="date-card-inner">
      <span class="date-card-icon">📅</span>
      <div>
        <div class="date-card-label">日付（タップして変更）</div>
        <div class="date-card-text" id="date-card-text"></div>
      </div>
      <span class="existing-badge" id="existing-badge"></span>
    </div>
    <input type="date" id="report-date">
  </div>

  <div class="section">
    <div class="reporter-row">
      <label for="reporter">報告者</label>
      <input type="text" id="reporter" class="reporter-input" placeholder="氏名を入力">
    </div>
  </div>

  <div class="section">
    <div class="section-label">【特記事項】</div>
    <div id="residents-container"></div>
  </div>

  <div class="section">
    <div class="section-label">【不足品】</div>
    <div id="shortage-list"></div>
    <button type="button" class="btn-add-shortage" id="btn-add-shortage">＋ 項目を追加</button>
  </div>

  <div class="draft-indicator" id="draft-indicator"></div>

  <div class="bottom-bar">
    <button class="btn-summary" onclick="showSummary()">📋 まとめを見る</button>
    <button class="btn-word" onclick="exportWord()">📄 Word出力</button>
  </div>

  <div id="modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeModal()">
    <div class="modal-box">
      <div class="modal-head">
        <h2>報告書 プレビュー</h2>
        <button class="btn-share" onclick="shareURL()">📤 URLをシェア</button>
        <button class="btn-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="summary-body"></div>
    </div>
  </div>

  <script>
    const GH_NAMES = [
      'こもれびホーム３−２',
      'こもれびホーム４',
      'こもれびホーム５−１',
      'こもれびホーム５−２',
      'こもれびホーム６',
      'こもれびホームマハロ'
    ];

    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const params = new URLSearchParams(location.search);
    const ghNum = params.get('gh');
    const ghName = ghNum ? (GH_NAMES[parseInt(ghNum) - 1] || `ホーム${ghNum}`) : '';

    // ─── GH Selection Screen ───────────────────────────────
    if (!ghNum) {
      const screen = document.getElementById('gh-select-screen');
      screen.style.display = 'flex';
      const btnsContainer = document.getElementById('gh-select-btns');
      GH_NAMES.forEach((name, idx) => {
        const btn = document.createElement('button');
        btn.className = 'gh-select-btn';
        btn.textContent = name;
        btn.onclick = () => {
          location.href = `report.html?gh=${idx + 1}`;
        };
        btnsContainer.appendChild(btn);
      });
    }
    const urlDate = params.get('date');

    function todayISO() {
      const t = new Date();
      return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
    }
    function getReiwaDate(isoDate) {
      const [y, m, d] = isoDate.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      const days = ['日','月','火','水','木','金','土'];
      return `令和${y - 2018}年${m}月${d}日（${days[dt.getDay()]}）`;
    }

    document.getElementById('gh-title').textContent = ghName;
    document.title = `${ghName} 業務日報`;

    const dateEl = document.getElementById('report-date');
    dateEl.value = urlDate || todayISO();
    refreshDateDisplay();

    document.getElementById('date-card-section').addEventListener('click', () => {
      try {
        if (typeof dateEl.showPicker === 'function') dateEl.showPicker();
        else dateEl.focus();
      } catch(e) { dateEl.focus(); }
    });

    dateEl.addEventListener('change', async () => {
      await saveCurrentData();
      refreshDateDisplay();
      await loadDateData(dateEl.value);
    });

    function refreshDateDisplay() {
      const str = getReiwaDate(dateEl.value);
      document.getElementById('date-display').textContent = str;
      document.getElementById('date-card-text').textContent = str;
    }

    // ─── Residents ────────────────────────────────────────
    function autoExpand(el) {
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 'px';
    }

    async function initResidents() {
      const container = document.getElementById('residents-container');
      container.innerHTML = '<div style="text-align:center;padding:20px;color:#aaa;font-size:14px">読み込み中...</div>';

      const { data } = await db.from('residents')
        .select('name')
        .eq('gh_num', parseInt(ghNum))
        .eq('active', true)
        .order('sort_order');

      const residentNames = (data || []).map(r => r.name);
      container.innerHTML = '';

      if (residentNames.length === 0) {
        container.innerHTML = `
          <div class="no-residents">
            <p>利用者が登録されていません</p>
            <p style="font-size:13px;color:#aaa;margin-top:8px">管理者ページから利用者を登録してください</p>
          </div>
        `;
        return;
      }

      residentNames.forEach(name => {
        const div = document.createElement('div');
        div.className = 'resident-entry';
        div.dataset.name = name;
        div.innerHTML = `
          <div class="resident-name-label">${name}</div>
          <textarea placeholder="${name}の様子を記入（帰宅〜朝の流れ）..."></textarea>
        `;
        container.appendChild(div);
      });

      container.querySelectorAll('textarea').forEach(ta => {
        ta.addEventListener('input', function() {
          autoExpand(this);
          scheduleAutoSave();
        });
      });
    }

    // ─── Shortage List ────────────────────────────────────
    let shortageItems = []; // [{text, checked}]

    function renderShortageList() {
      const list = document.getElementById('shortage-list');
      list.innerHTML = '';
      shortageItems.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = 'shortage-item-row';
        const bullet = document.createElement('span');
        bullet.className = 'shortage-bullet';
        bullet.textContent = '・';
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'shortage-item-input';
        input.value = item.text;
        input.placeholder = '品目を入力';
        input.addEventListener('input', (e) => {
          shortageItems[idx].text = e.target.value;
          scheduleAutoSave();
        });
        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'btn-remove-shortage';
        removeBtn.textContent = '✕';
        removeBtn.addEventListener('click', () => {
          shortageItems.splice(idx, 1);
          renderShortageList();
          scheduleAutoSave();
        });
        div.appendChild(bullet);
        div.appendChild(input);
        div.appendChild(removeBtn);
        list.appendChild(div);
      });
    }

    document.getElementById('btn-add-shortage').addEventListener('click', () => {
      shortageItems.push({ text: '', checked: false });
      renderShortageList();
      const inputs = document.querySelectorAll('.shortage-item-input');
      if (inputs.length > 0) inputs[inputs.length - 1].focus();
    });

    // ─── Reporter (name cached in localStorage for convenience) ───
    const reporterEl = document.getElementById('reporter');
    reporterEl.value = localStorage.getItem('lastReporter') || '';
    reporterEl.addEventListener('input', () => {
      localStorage.setItem('lastReporter', reporterEl.value.trim());
      scheduleAutoSave();
    });

    // ─── Auto-save ────────────────────────────────────────
    let saveTimer = null;
    function scheduleAutoSave() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveCurrentData, 800);
    }

    async function saveCurrentData() {
      const dateISO = dateEl.value;
      const reporter = reporterEl.value.trim();
      const shortageData = shortageItems
        .filter(item => item.text.trim())
        .map(item => ({ text: item.text.trim(), checked: item.checked || false }));
      const residentsData = {};
      let hasContent = !!reporter || shortageData.length > 0;
      document.querySelectorAll('.resident-entry').forEach(entry => {
        const val = entry.querySelector('textarea').value;
        residentsData[entry.dataset.name] = val;
        if (val.trim()) hasContent = true;
      });

      if (!hasContent) return;

      const { error } = await db.from('reports').upsert({
        gh_num: parseInt(ghNum),
        gh_name: ghName,
        report_date: dateISO,
        reporter: reporter,
        residents: residentsData,
        shortage: shortageData,
        updated_at: new Date().toISOString()
      }, { onConflict: 'gh_num,report_date' });

      const ind = document.getElementById('draft-indicator');
      if (error) {
        ind.style.color = '#e74c3c';
        ind.textContent = '⚠️ 保存失敗: ' + error.message;
      } else {
        ind.style.color = '';
        ind.textContent = '保存しました ✓';
        document.getElementById('existing-badge').textContent = '記録あり ✓';
      }
      setTimeout(() => ind.textContent = '', 3000);
    }

    async function loadDateData(dateISO) {
      const { data } = await db.from('reports').select('*')
        .eq('gh_num', parseInt(ghNum))
        .eq('report_date', dateISO)
        .maybeSingle();

      document.getElementById('existing-badge').textContent = data ? '記録あり ✓' : '';

      if (data) {
        reporterEl.value = data.reporter || '';
        shortageItems = (data.shortage || []).map(item =>
          typeof item === 'string'
            ? { text: item, checked: false }
            : { text: item.text || '', checked: !!item.checked }
        );
        renderShortageList();
        document.querySelectorAll('.resident-entry').forEach(entry => {
          const ta = entry.querySelector('textarea');
          ta.value = (data.residents || {})[entry.dataset.name] || '';
          autoExpand(ta);
        });
      } else {
        reporterEl.value = localStorage.getItem('lastReporter') || '';
        shortageItems = [];
        renderShortageList();
        document.querySelectorAll('.resident-entry textarea').forEach(ta => {
          ta.value = '';
          ta.style.height = '';
        });
      }
    }

    // ─── Summary Modal ────────────────────────────────────
    function showSummary() {
      const reporter = reporterEl.value || '（未入力）';
      const dateStr = getReiwaDate(dateEl.value);

      let entriesHTML = '';
      document.querySelectorAll('.resident-entry').forEach(entry => {
        const name = entry.dataset.name;
        const text = entry.querySelector('textarea').value || '（未入力）';
        entriesHTML += `
          <div class="s-resident">
            <div class="r-name">${name}</div>
            <div class="r-text">${text}</div>
          </div>
        `;
      });

      document.getElementById('summary-body').innerHTML = `
        <table class="s-table">
          <tr>
            <td rowspan="2" style="width:34%">
              <div style="font-weight:bold;font-size:14px;margin-bottom:4px">報告書</div>
              <div style="font-size:12px;color:#444">${dateStr}</div>
            </td>
            <td rowspan="2" class="s-gh-name">${ghName}</td>
            <td class="s-sig-head">管理者</td>
            <td class="s-sig-head">サービス管理責任者</td>
            <td class="s-sig-head">報告者</td>
          </tr>
          <tr>
            <td class="s-sig-box"></td>
            <td class="s-sig-box"></td>
            <td style="font-size:14px;font-weight:bold;padding:8px">${reporter}</td>
          </tr>
        </table>
        <div class="s-sec-title">【特記事項】</div>
        ${entriesHTML || '<p style="color:#999;font-size:13px">（利用者未登録）</p>'}
        ${shortageItems.filter(i => i.text.trim()).length > 0 ? `
          <div class="s-sec-title">【不足品】</div>
          ${shortageItems.filter(i => i.text.trim()).map(i =>
            `<div class="s-resident"><div class="r-name">${i.text}</div></div>`
          ).join('')}
        ` : ''}
        <div style="height:20px"></div>
      `;

      document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }

    // ─── Share URL (clean query params, data loaded from Supabase) ───
    function shareURL() {
      const base = location.href.split('report.html')[0];
      const url = `${base}summary.html?gh=${ghNum}&date=${dateEl.value}`;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(() => {
          alert('URLをコピーしました！\n管理者へ送信してください。\n（admin.htmlでもリアルタイム確認できます）');
        }).catch(() => prompt('以下のURLをコピーして送信してください：', url));
      } else {
        prompt('以下のURLをコピーして送信してください：', url);
      }
    }

    // ─── Word Export ──────────────────────────────────────
    async function exportWord() {
      try { await loadWordLibs(); } catch(e) { alert('Word出力ライブラリの読み込みに失敗しました'); return; }
      saveCurrentData();
      const reporter = reporterEl.value || '';
      const dateStr = getReiwaDate(dateEl.value);

      let entriesHTML = '';
      document.querySelectorAll('.resident-entry').forEach(entry => {
        const name = entry.dataset.name;
        const text = (entry.querySelector('textarea').value || '')
          .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
          .replace(/\n/g,'<br>');
        entriesHTML += `<p style="margin:0 0 10pt;line-height:1.8">・${name}：${text}</p>`;
      });

      const wordHTML = `<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
  body{font-family:'MS Mincho','MS Gothic','Meiryo',sans-serif;font-size:10.5pt;margin:20pt}
  table{border-collapse:collapse;width:100%;margin-bottom:14pt}
  td{border:1pt solid black;padding:6pt;vertical-align:middle}
  p{margin:0}
</style>
</head><body>
<table>
  <tr>
    <td rowspan="2" style="width:32%">
      <p style="font-weight:bold;font-size:12pt;margin-bottom:4pt">報告書</p>
      <p style="font-size:10pt">${dateStr}</p>
    </td>
    <td rowspan="2" style="text-align:center;font-size:16pt;font-weight:bold;width:28%">${ghName}</td>
    <td style="text-align:center;font-size:9pt;background:#f5f5f5">管理者</td>
    <td style="text-align:center;font-size:9pt;background:#f5f5f5">サービス管理責任者</td>
    <td style="text-align:center;font-size:9pt;background:#f5f5f5">報告者</td>
  </tr>
  <tr>
    <td style="height:44pt">&nbsp;</td>
    <td style="height:44pt">&nbsp;</td>
    <td style="height:44pt;font-weight:bold;font-size:11pt">${reporter}</td>
  </tr>
</table>
<p style="font-weight:bold;margin-bottom:8pt">【特記事項】</p>
${entriesHTML}
</body></html>`;

      try {
        const blob = htmlDocx.asBlob(wordHTML);
        const dateNum = dateEl.value.replace(/-/g,'');
        const safeName = ghName.replace(/[^　-鿿＀-￯゠-ヿa-zA-Z0-9]/g,'');
        saveAs(blob, `${safeName}_業務日報_${dateNum}.docx`);
      } catch(e) {
        alert('Word出力に失敗しました。\n' + e);
      }
    }

    // ─── Word libs (lazy load on first use) ──────────────
    let wordLibsLoaded = false;
    function loadWordLibs() {
      if (wordLibsLoaded) return Promise.resolve();
      return Promise.all([
        new Promise((res, rej) => {
          const s = document.createElement('script');
          s.src = 'https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js';
          s.onload = res; s.onerror = rej;
          document.head.appendChild(s);
        }),
        new Promise((res, rej) => {
          const s = document.createElement('script');
          s.src = 'https://unpkg.com/html-docx-js@0.3.1/dist/html-docx.js';
          s.onload = res; s.onerror = rej;
          document.head.appendChild(s);
        })
      ]).then(() => { wordLibsLoaded = true; });
    }

    // ─── Init (parallel fetch) ────────────────────────────
    async function init() {
      const dateISO = dateEl.value;
      const container = document.getElementById('residents-container');
      container.innerHTML = '<div style="text-align:center;padding:20px;color:#aaa;font-size:14px">読み込み中...</div>';

      const [{ data: residentsData }, { data: reportData }] = await Promise.all([
        db.from('residents').select('name').eq('gh_num', parseInt(ghNum)).eq('active', true).order('sort_order'),
        db.from('reports').select('*').eq('gh_num', parseInt(ghNum)).eq('report_date', dateISO).maybeSingle()
      ]);

      // Render residents
      const residentNames = (residentsData || []).map(r => r.name);
      container.innerHTML = '';
      if (residentNames.length === 0) {
        container.innerHTML = `
          <div class="no-residents">
            <p>利用者が登録されていません</p>
            <p style="font-size:13px;color:#aaa;margin-top:8px">管理者ページから利用者を登録してください</p>
          </div>`;
      } else {
        residentNames.forEach(name => {
          const div = document.createElement('div');
          div.className = 'resident-entry';
          div.dataset.name = name;
          div.innerHTML = `
            <div class="resident-name-label">${name}</div>
            <textarea placeholder="${name}の様子を記入（帰宅〜朝の流れ）..."></textarea>
          `;
          container.appendChild(div);
        });
        container.querySelectorAll('textarea').forEach(ta => {
          ta.addEventListener('input', function() { autoExpand(this); scheduleAutoSave(); });
        });
      }

      // Apply saved report data
      document.getElementById('existing-badge').textContent = reportData ? '記録あり ✓' : '';
      if (reportData) {
        reporterEl.value = reportData.reporter || '';
        shortageItems = (reportData.shortage || []).map(item =>
          typeof item === 'string' ? { text: item, checked: false } : { text: item.text || '', checked: !!item.checked }
        );
        renderShortageList();
        document.querySelectorAll('.resident-entry').forEach(entry => {
          const ta = entry.querySelector('textarea');
          ta.value = (reportData.residents || {})[entry.dataset.name] || '';
          autoExpand(ta);
        });
      } else {
        reporterEl.value = localStorage.getItem('lastReporter') || '';
        shortageItems = [];
        renderShortageList();
      }
    }
    init();
  </script>
</body>
</html>
