<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>業務日報 入力</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="https://unpkg.com/html-docx-js@0.3.1/dist/html-docx.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', 'Yu Gothic', sans-serif;
      background: #eef2f7;
      min-height: 100vh;
      padding-bottom: 120px;
    }

    .page-header {
      background: #4a90d9;
      color: white;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .page-header a { color: white; text-decoration: none; font-size: 26px; line-height: 1; }
    .page-header .h-info h1 { font-size: 16px; font-weight: bold; line-height: 1.3; }
    .page-header .h-info .sub { font-size: 12px; opacity: 0.85; margin-top: 2px; }

    .section {
      background: white;
      margin: 14px 16px;
      border-radius: 12px;
      padding: 16px 18px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .section-label {
      font-size: 13px;
      font-weight: bold;
      color: #4a90d9;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid #eef2f7;
    }

    /* DATE CARD — entire area is clickable via showPicker() */
    .date-card-section {
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .date-card-section:active { background: #f0f6ff; }
    .date-card-inner {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
    }
    .date-card-icon { font-size: 26px; flex-shrink: 0; }
    .date-card-label { font-size: 12px; color: #7a8a9a; margin-bottom: 3px; }
    .date-card-text { font-size: 17px; font-weight: bold; color: #1a2a3a; }
    .existing-badge {
      margin-left: auto;
      font-size: 12px;
      color: #2ecc71;
      font-weight: bold;
      white-space: nowrap;
      flex-shrink: 0;
    }
    /* Input hidden — opened programmatically via showPicker() */
    #report-date {
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px;
      border: 0;
      pointer-events: none;
    }

    /* REPORTER */
    .reporter-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .reporter-row label {
      font-size: 14px;
      color: #5a6a7a;
      font-weight: bold;
      white-space: nowrap;
    }
    .reporter-input {
      flex: 1;
      padding: 11px 14px;
      border: 1.5px solid #d0d8e8;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      color: #1a2a3a;
    }
    .reporter-input:focus {
      outline: none;
      border-color: #4a90d9;
      box-shadow: 0 0 0 3px rgba(74,144,217,0.15);
    }

    /* RESIDENT ENTRIES */
    .resident-entry {
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid #f0f2f5;
    }
    .resident-entry:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

    .resident-name-label {
      font-size: 15px;
      font-weight: bold;
      color: #1a2a3a;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .resident-name-label::before { content: '・'; color: #4a90d9; font-size: 20px; line-height: 1; }

    textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #d0d8e8;
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      color: #1a2a3a;
      line-height: 1.8;
      resize: none;
      overflow: hidden;
      min-height: 100px;
    }
    textarea:focus {
      outline: none;
      border-color: #4a90d9;
      box-shadow: 0 0 0 3px rgba(74,144,217,0.15);
    }
    textarea::placeholder { color: #bbc; }

    .no-residents { text-align: center; padding: 20px 0; }
    .no-residents p { color: #999; margin-bottom: 14px; }
    .btn-go-settings {
      display: inline-block;
      padding: 11px 22px;
      background: #4a90d9;
      color: white;
      border-radius: 10px;
      text-decoration: none;
      font-size: 15px;
      font-weight: bold;
    }

    /* BOTTOM BAR */
    .bottom-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: white;
      padding: 12px 16px 28px;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.1);
      display: flex;
      gap: 12px;
    }
    .btn-summary {
      flex: 1;
      padding: 14px;
      background: white;
      border: 2px solid #4a90d9;
      border-radius: 12px;
      color: #4a90d9;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-word {
      flex: 1;
      padding: 14px;
      background: #4a90d9;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-word:active { background: #3a7bc8; }
    .btn-summary:active { background: #f0f6ff; }

    .draft-indicator {
      font-size: 11px;
      color: #4a90d9;
      text-align: right;
      padding: 4px 16px 0;
      opacity: 0.7;
      height: 20px;
    }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      display: flex;
      align-items: flex-end;
    }
    .modal-box {
      background: white;
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
    }
    .modal-head {
      padding: 14px 16px;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }
    .modal-head h2 { font-size: 15px; font-weight: bold; flex: 1; }
    .btn-share {
      padding: 8px 14px;
      background: #2ecc71;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .btn-share:active { background: #27ae60; }
    .btn-close {
      flex-shrink: 0;
      background: #f0f0f0;
      border: none;
      border-radius: 50%;
      width: 32px; height: 32px;
      font-size: 16px;
      cursor: pointer;
    }
    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      -webkit-overflow-scrolling: touch;
    }

    /* SUMMARY */
    .s-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 18px; }
    .s-table td { border: 1.5px solid #333; padding: 8px 10px; vertical-align: middle; }
    .s-gh-name { text-align: center; font-size: 17px; font-weight: bold; }
    .s-sig-head { text-align: center; font-size: 11px; color: #555; background: #f8f8f8; }
    .s-sig-box { height: 44px; }
    .s-sec-title {
      font-weight: bold; font-size: 14px;
      margin: 16px 0 10px;
      padding: 6px 12px;
      background: #f0f6ff;
      border-left: 4px solid #4a90d9;
      border-radius: 0 6px 6px 0;
    }
    .s-resident { margin-bottom: 14px; }
    .s-resident .r-name { font-weight: bold; font-size: 14px; margin-bottom: 4px; }
    .s-resident .r-name::before { content: '・'; color: #4a90d9; }
    .s-resident .r-text {
      font-size: 13px; line-height: 1.8; white-space: pre-wrap;
      background: #f9f9f9; padding: 10px 14px; border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="page-header">
    <a href="index.html">←</a>
    <div class="h-info">
      <h1 id="gh-title">ホーム</h1>
      <div class="sub" id="date-display"></div>
    </div>
  </div>

  <!-- 日付選択：カード全体がクリック領域 -->
  <div class="section date-card-section" id="date-card-section">
    <div class="date-card-inner">
      <span class="date-card-icon">📅</span>
      <div>
        <div class="date-card-label">日付（タップして変更）</div>
        <div class="date-card-text" id="date-card-text"></div>
      </div>
      <span class="existing-badge" id="existing-badge"></span>
    </div>
    <input type="date" id="report-date">
  </div>

  <!-- 報告者 -->
  <div class="section">
    <div class="reporter-row">
      <label for="reporter">報告者</label>
      <input type="text" id="reporter" class="reporter-input" placeholder="氏名を入力">
    </div>
  </div>

  <!-- 特記事項 -->
  <div class="section">
    <div class="section-label">【特記事項】</div>
    <div id="residents-container"></div>
  </div>

  <div class="draft-indicator" id="draft-indicator"></div>

  <div class="bottom-bar">
    <button class="btn-summary" onclick="showSummary()">📋 まとめを見る</button>
    <button class="btn-word" onclick="exportWord()">📄 Word出力</button>
  </div>

  <!-- Summary Modal -->
  <div id="modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeModal()">
    <div class="modal-box">
      <div class="modal-head">
        <h2>報告書 プレビュー</h2>
        <button class="btn-share" onclick="shareURL()">📤 URLをシェア</button>
        <button class="btn-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="summary-body"></div>
    </div>
  </div>

  <script>
    const GH_NAMES = [
      'こもれびホーム３−２',
      'こもれびホーム４',
      'こもれびホーム５−１',
      'こもれびホーム５−２',
      'こもれびホーム６',
      'こもれびホームマハロ'
    ];
    const STORE = 'komorebi_reports';

    const params = new URLSearchParams(location.search);
    const ghNum = params.get('gh') || '1';
    const ghName = GH_NAMES[parseInt(ghNum) - 1] || `ホーム${ghNum}`;
    const urlDate = params.get('date');

    // ─── Storage ──────────────────────────────────────────
    function getAllData() {
      return JSON.parse(localStorage.getItem(STORE) || '{}');
    }
    function loadReport(dateISO) {
      return (getAllData()[ghNum] || {})[dateISO] || null;
    }
    function saveReport(dateISO, data) {
      const all = getAllData();
      if (!all[ghNum]) all[ghNum] = {};
      all[ghNum][dateISO] = { ...data, savedAt: new Date().toISOString() };
      localStorage.setItem(STORE, JSON.stringify(all));
    }

    // ─── Date helpers ─────────────────────────────────────
    function todayISO() {
      const t = new Date();
      return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
    }
    function getReiwaDate(isoDate) {
      const [y, m, d] = isoDate.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      const days = ['日','月','火','水','木','金','土'];
      return `令和${y - 2018}年${m}月${d}日（${days[dt.getDay()]}）`;
    }

    // ─── Init header ──────────────────────────────────────
    document.getElementById('gh-title').textContent = ghName;
    document.title = `${ghName} 業務日報`;

    // ─── Date picker ──────────────────────────────────────
    const dateEl = document.getElementById('report-date');
    dateEl.value = urlDate || todayISO();
    refreshDateDisplay();
    updateExistingBadge();

    // Card click → open native date picker
    document.getElementById('date-card-section').addEventListener('click', () => {
      try {
        if (typeof dateEl.showPicker === 'function') dateEl.showPicker();
        else dateEl.focus();
      } catch(e) { dateEl.focus(); }
    });

    dateEl.addEventListener('change', () => {
      saveCurrentData();
      refreshDateDisplay();
      updateExistingBadge();
      loadDateData(dateEl.value);
    });

    function refreshDateDisplay() {
      const str = getReiwaDate(dateEl.value);
      document.getElementById('date-display').textContent = str;
      document.getElementById('date-card-text').textContent = str;
    }

    function updateExistingBadge() {
      document.getElementById('existing-badge').textContent =
        loadReport(dateEl.value) ? '記録あり ✓' : '';
    }

    // ─── Residents ────────────────────────────────────────
    const residents = (JSON.parse(localStorage.getItem('ghResidents') || '{}')[ghNum]) || [];
    const container = document.getElementById('residents-container');

    if (residents.length === 0) {
      container.innerHTML = `
        <div class="no-residents">
          <p>利用者が登録されていません</p>
          <a href="settings.html" class="btn-go-settings">⚙️ 設定で利用者を登録する</a>
        </div>
      `;
    } else {
      residents.forEach(name => {
        const div = document.createElement('div');
        div.className = 'resident-entry';
        div.dataset.name = name;
        div.innerHTML = `
          <div class="resident-name-label">${name}</div>
          <textarea placeholder="${name}の様子を記入（帰宅〜朝の流れ）..."></textarea>
        `;
        container.appendChild(div);
      });
    }

    // ─── Auto-expand ──────────────────────────────────────
    function autoExpand(el) {
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 'px';
    }
    document.querySelectorAll('textarea').forEach(ta => {
      ta.addEventListener('input', function() {
        autoExpand(this);
        scheduleAutoSave();
      });
    });

    // ─── Reporter ─────────────────────────────────────────
    const reporterEl = document.getElementById('reporter');
    reporterEl.value = localStorage.getItem('lastReporter') || '';
    reporterEl.addEventListener('input', () => {
      localStorage.setItem('lastReporter', reporterEl.value.trim());
      scheduleAutoSave();
    });

    // ─── Auto-save ────────────────────────────────────────
    let saveTimer = null;
    function scheduleAutoSave() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveCurrentData, 800);
    }

    function saveCurrentData() {
      const dateISO = dateEl.value;
      const data = { reporter: reporterEl.value.trim(), residents: {} };
      document.querySelectorAll('.resident-entry').forEach(entry => {
        data.residents[entry.dataset.name] = entry.querySelector('textarea').value;
      });
      saveReport(dateISO, data);
      updateExistingBadge();
      const ind = document.getElementById('draft-indicator');
      ind.textContent = '保存しました ✓';
      setTimeout(() => ind.textContent = '', 2000);
    }

    function loadDateData(dateISO) {
      const data = loadReport(dateISO);
      if (data) {
        reporterEl.value = data.reporter || '';
        document.querySelectorAll('.resident-entry').forEach(entry => {
          const ta = entry.querySelector('textarea');
          ta.value = (data.residents || {})[entry.dataset.name] || '';
          autoExpand(ta);
        });
      } else {
        reporterEl.value = localStorage.getItem('lastReporter') || '';
        document.querySelectorAll('.resident-entry textarea').forEach(ta => {
          ta.value = '';
          ta.style.height = '';
        });
      }
    }

    // ─── Summary Modal ────────────────────────────────────
    function showSummary() {
      const reporter = reporterEl.value || '（未入力）';
      const dateStr = getReiwaDate(dateEl.value);

      let entriesHTML = '';
      document.querySelectorAll('.resident-entry').forEach(entry => {
        const name = entry.dataset.name;
        const text = entry.querySelector('textarea').value || '（未入力）';
        entriesHTML += `
          <div class="s-resident">
            <div class="r-name">${name}</div>
            <div class="r-text">${text}</div>
          </div>
        `;
      });

      document.getElementById('summary-body').innerHTML = `
        <table class="s-table">
          <tr>
            <td rowspan="2" style="width:34%">
              <div style="font-weight:bold;font-size:14px;margin-bottom:4px">報告書</div>
              <div style="font-size:12px;color:#444">${dateStr}</div>
            </td>
            <td rowspan="2" class="s-gh-name">${ghName}</td>
            <td class="s-sig-head">管理者</td>
            <td class="s-sig-head">サービス管理責任者</td>
            <td class="s-sig-head">報告者</td>
          </tr>
          <tr>
            <td class="s-sig-box"></td>
            <td class="s-sig-box"></td>
            <td style="font-size:14px;font-weight:bold;padding:8px">${reporter}</td>
          </tr>
        </table>
        <div class="s-sec-title">【特記事項】</div>
        ${entriesHTML || '<p style="color:#999;font-size:13px">（利用者未登録）</p>'}
        <div style="height:20px"></div>
      `;

      document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }

    // ─── Share URL ────────────────────────────────────────
    function shareURL() {
      saveCurrentData();
      const payload = {
        gh: ghNum,
        ghName: ghName,
        date: dateEl.value,
        reporter: reporterEl.value,
        residents: {},
        sharedAt: new Date().toISOString()
      };
      document.querySelectorAll('.resident-entry').forEach(entry => {
        payload.residents[entry.dataset.name] = entry.querySelector('textarea').value;
      });

      const json = JSON.stringify(payload);
      const encoded = btoa(unescape(encodeURIComponent(json)));
      const base = location.href.replace('report.html', 'summary.html').split('?')[0].split('#')[0];
      const url = `${base}#${encoded}`;

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(() => {
          alert('URLをコピーしました！\nLINEなどに貼り付けて管理者に送ってください。');
        }).catch(() => showURLPrompt(url));
      } else {
        showURLPrompt(url);
      }
    }

    function showURLPrompt(url) {
      prompt('以下のURLをコピーして送信してください：', url);
    }

    // ─── Word Export ──────────────────────────────────────
    function exportWord() {
      saveCurrentData();
      const reporter = reporterEl.value || '';
      const dateStr = getReiwaDate(dateEl.value);

      let entriesHTML = '';
      document.querySelectorAll('.resident-entry').forEach(entry => {
        const name = entry.dataset.name;
        const text = (entry.querySelector('textarea').value || '')
          .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
          .replace(/\n/g,'<br>');
        entriesHTML += `<p style="margin:0 0 10pt;line-height:1.8">・${name}：${text}</p>`;
      });

      const wordHTML = `<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
  body{font-family:'MS Mincho','MS Gothic','Meiryo',sans-serif;font-size:10.5pt;margin:20pt}
  table{border-collapse:collapse;width:100%;margin-bottom:14pt}
  td{border:1pt solid black;padding:6pt;vertical-align:middle}
  p{margin:0}
</style>
</head><body>
<table>
  <tr>
    <td rowspan="2" style="width:32%">
      <p style="font-weight:bold;font-size:12pt;margin-bottom:4pt">報告書</p>
      <p style="font-size:10pt">${dateStr}</p>
    </td>
    <td rowspan="2" style="text-align:center;font-size:16pt;font-weight:bold;width:28%">${ghName}</td>
    <td style="text-align:center;font-size:9pt;background:#f5f5f5">管理者</td>
    <td style="text-align:center;font-size:9pt;background:#f5f5f5">サービス管理責任者</td>
    <td style="text-align:center;font-size:9pt;background:#f5f5f5">報告者</td>
  </tr>
  <tr>
    <td style="height:44pt">&nbsp;</td>
    <td style="height:44pt">&nbsp;</td>
    <td style="height:44pt;font-weight:bold;font-size:11pt">${reporter}</td>
  </tr>
</table>
<p style="font-weight:bold;margin-bottom:8pt">【特記事項】</p>
${entriesHTML}
</body></html>`;

      try {
        const blob = htmlDocx.asBlob(wordHTML);
        const dateNum = dateEl.value.replace(/-/g,'');
        const safeName = ghName.replace(/[^　-鿿＀-￯゠-ヿa-zA-Z0-9]/g,'');
        saveAs(blob, `${safeName}_業務日報_${dateNum}.docx`);
      } catch(e) {
        alert('Word出力に失敗しました。\n' + e);
      }
    }

    // ─── Init ─────────────────────────────────────────────
    loadDateData(dateEl.value);
  </script>
</body>
</html>
