<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>業務日報 入力</title>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', 'Yu Gothic', sans-serif;
      background: #eef2f7;
      min-height: 100vh;
      padding-bottom: 120px;
    }

    .page-header {
      background: #4a90d9;
      color: white;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .page-header a { color: white; text-decoration: none; font-size: 26px; line-height: 1; }
    .page-header .h-info h1 { font-size: 16px; font-weight: bold; line-height: 1.3; }
    .page-header .h-info .sub { font-size: 12px; opacity: 0.85; margin-top: 2px; }

    .section {
      background: white;
      margin: 14px 16px;
      border-radius: 12px;
      padding: 16px 18px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .section-label {
      font-size: 13px;
      font-weight: bold;
      color: #4a90d9;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid #eef2f7;
    }

    .date-card-section {
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 14px;
      position: relative;
      overflow: hidden;
    }
    .date-card-section:active { background: #f0f6ff; }
    .date-card-inner {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
    }
    .date-card-icon { font-size: 26px; flex-shrink: 0; }
    .date-card-label { font-size: 12px; color: #7a8a9a; margin-bottom: 3px; }
    .date-card-text { font-size: 17px; font-weight: bold; color: #1a2a3a; }
    .existing-badge {
      margin-left: auto;
      font-size: 12px;
      color: #2ecc71;
      font-weight: bold;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #report-date {
      position: absolute;
      opacity: 0;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      cursor: pointer;
      z-index: 10;
    }

    .reporter-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .reporter-row label {
      font-size: 14px;
      color: #5a6a7a;
      font-weight: bold;
      white-space: nowrap;
    }
    .reporter-input {
      flex: 1;
      padding: 11px 14px;
      border: 1.5px solid #d0d8e8;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      color: #1a2a3a;
    }
    .reporter-input:focus {
      outline: none;
      border-color: #4a90d9;
      box-shadow: 0 0 0 3px rgba(74,144,217,0.15);
    }

    .resident-entry {
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid #f0f2f5;
    }
    .resident-entry:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

    .resident-name-label {
      font-size: 15px;
      font-weight: bold;
      color: #1a2a3a;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .resident-name-label::before { content: '・'; color: #4a90d9; font-size: 20px; line-height: 1; }

    .diaper-stepper-row {
      display: flex; align-items: center; gap: 10px;
      margin-top: 8px; padding: 8px 10px;
      background: #f8f9fa; border-radius: 8px; font-size: 13px; color: #3a4a5a;
    }
    .diaper-stepper-name { flex: 1; }
    .diaper-stepper-btn {
      width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid #4a90d9;
      background: white; color: #4a90d9; font-size: 16px; font-weight: bold;
      line-height: 1; cursor: pointer;
    }
    .diaper-stepper-btn:active { background: #eef6ff; }
    .diaper-stepper-count { min-width: 24px; text-align: center; font-weight: bold; }

    textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #d0d8e8;
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      color: #1a2a3a;
      line-height: 1.8;
      resize: none;
      overflow: hidden;
      min-height: 100px;
    }
    textarea:focus {
      outline: none;
      border-color: #4a90d9;
      box-shadow: 0 0 0 3px rgba(74,144,217,0.15);
    }
    textarea::placeholder { color: #bbc; }

    .no-residents { text-align: center; padding: 20px 0; }
    .no-residents p { color: #999; margin-bottom: 14px; }

    .short-stay-section {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 2px dashed #d0d8e8;
    }
    .short-stay-title {
      font-size: 13px;
      font-weight: bold;
      color: #7a8a9a;
      margin-bottom: 14px;
      letter-spacing: 0.05em;
    }
    .short-stay-entry {
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid #f0f2f5;
    }
    .short-stay-entry:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .short-stay-name-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .short-stay-label {
      font-size: 14px;
      font-weight: bold;
      color: #4a90d9;
      white-space: nowrap;
    }
    .short-stay-name-input {
      flex: 1;
      padding: 6px 10px;
      border: 1.5px solid #d0d8e8;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      color: #1a2a3a;
    }
    .short-stay-name-input:focus {
      outline: none;
      border-color: #4a90d9;
      box-shadow: 0 0 0 3px rgba(74,144,217,0.15);
    }
    .btn-go-settings {
      display: inline-block;
      padding: 11px 22px;
      background: #4a90d9;
      color: white;
      border-radius: 10px;
      text-decoration: none;
      font-size: 15px;
      font-weight: bold;
    }

    .bottom-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: white;
      padding: 12px 16px 28px;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.1);
      display: flex;
      gap: 12px;
    }
    .btn-summary {
      flex: 1;
      padding: 14px;
      background: white;
      border: 2px solid #4a90d9;
      border-radius: 12px;
      color: #4a90d9;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-word {
      flex: 1;
      padding: 14px;
      background: #4a90d9;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-word:active { background: #3a7bc8; }
    .btn-summary:active { background: #f0f6ff; }

    .draft-indicator {
      font-size: 11px;
      color: #4a90d9;
      text-align: right;
      padding: 4px 16px 0;
      opacity: 0.7;
      height: 20px;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      display: flex;
      align-items: flex-end;
    }
    .modal-box {
      background: white;
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
    }
    .modal-head {
      padding: 14px 16px;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }
    .modal-head h2 { font-size: 15px; font-weight: bold; flex: 1; }
    .btn-share {
      padding: 8px 14px;
      background: #2ecc71;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .btn-share:active { background: #27ae60; }
    .btn-close {
      flex-shrink: 0;
      background: #f0f0f0;
      border: none;
      border-radius: 50%;
      width: 32px; height: 32px;
      font-size: 16px;
      cursor: pointer;
    }
    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      -webkit-overflow-scrolling: touch;
    }

    .s-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 18px; }
    .s-table td { border: 1.5px solid #333; padding: 8px 10px; vertical-align: middle; }
    .s-gh-name { text-align: center; font-size: 17px; font-weight: bold; }
    .s-sig-head { text-align: center; font-size: 11px; color: #555; background: #f8f8f8; }
    .s-sig-box { height: 44px; }
    .s-sec-title {
      font-weight: bold; font-size: 14px;
      margin: 16px 0 10px;
      padding: 6px 12px;
      background: #f0f6ff;
      border-left: 4px solid #4a90d9;
      border-radius: 0 6px 6px 0;
    }
    .s-resident { margin-bottom: 14px; }
    .s-resident .r-name { font-weight: bold; font-size: 14px; margin-bottom: 4px; }
    .s-resident .r-name::before { content: '・'; color: #4a90d9; }
    .s-resident .r-text {
      font-size: 13px; line-height: 1.8; white-space: pre-wrap;
      background: #f9f9f9; padding: 10px 14px; border-radius: 8px;
    }

    /* SHORTAGE LIST */
    .shortage-item-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .shortage-bullet { color: #4a90d9; font-size: 18px; flex-shrink: 0; }
    .shortage-item-input {
      flex: 1;
      padding: 10px 12px;
      border: 1.5px solid #d0d8e8;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      color: #1a2a3a;
    }
    .shortage-item-input:focus { outline: none; border-color: #4a90d9; }
    .btn-remove-shortage {
      width: 28px; height: 28px;
      background: #f0f0f0;
      border: none;
      border-radius: 50%;
      font-size: 14px;
      cursor: pointer;
      flex-shrink: 0;
      color: #888;
    }
    .btn-remove-shortage:active { background: #ffecec; color: #e74c3c; }
    .btn-add-shortage {
      margin-top: 8px;
      padding: 10px 16px;
      background: #f0f6ff;
      border: 1.5px dashed #4a90d9;
      border-radius: 8px;
      color: #4a90d9;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      width: 100%;
    }
    .btn-add-shortage:active { background: #e0eeff; }

    /* PHOTO UPLOAD */
    .photo-upload-area {
      border: 2px dashed #c0d4f0;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      background: #f8fbff;
      transition: border-color 0.2s;
      margin-bottom: 14px;
    }
    .photo-upload-area:active { border-color: #4a90d9; background: #eef6ff; }
    .photo-upload-area p { font-size: 14px; color: #7a8a9a; margin-top: 8px; }
    .photo-upload-icon { font-size: 36px; }
    #photo-input { display: none; }
    .photo-preview-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .photo-thumb-wrap {
      position: relative;
      width: calc(50% - 6px);
    }
    .photo-thumb-wrap img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      border-radius: 10px;
      display: block;
    }
    .btn-remove-photo {
      position: absolute;
      top: 6px; right: 6px;
      width: 26px; height: 26px;
      background: rgba(0,0,0,0.55);
      color: white;
      border: none;
      border-radius: 50%;
      font-size: 14px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .photo-uploading {
      font-size: 12px; color: #4a90d9;
      text-align: center; padding: 6px 0;
    }

    /* GH SELECTION SCREEN */
    .gh-select-screen {
      position: fixed; inset: 0;
      background: #2c3e50; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .gh-select-box {
      background: white; border-radius: 20px;
      padding: 32px 24px; width: 100%; max-width: 360px;
      text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .gh-select-box h2 {
      font-size: 18px; color: #1a2a3a; margin-bottom: 6px;
    }
    .gh-select-box p {
      font-size: 13px; color: #7a8a9a; margin-bottom: 24px;
    }
    .gh-select-btns { display: flex; flex-direction: column; gap: 10px; }
    .gh-select-btn {
      width: 100%; padding: 14px;
      background: #f0f6ff; border: 1.5px solid #c0d4f0;
      border-radius: 12px; font-size: 15px; font-weight: bold;
      color: #2c3e50; font-family: inherit; cursor: pointer;
      text-align: left; transition: all 0.12s;
    }
    .gh-select-btn:active { background: #4a90d9; color: white; border-color: #4a90d9; }
  </style>
</head>
<body>

  <!-- GH Selection Screen -->
  <div id="gh-select-screen" class="gh-select-screen" style="display:none">
    <div class="gh-select-box">
      <h2>🏠 業務日報</h2>
      <p>担当するホームを選んでください</p>
      <div class="gh-select-btns" id="gh-select-btns"></div>
    </div>
  </div>

  <div class="page-header">
    <a href="index.html">←</a>
    <div class="h-info">
      <h1 id="gh-title">ホーム</h1>
      <div class="sub" id="date-display"></div>
    </div>
  </div>

  <div class="section date-card-section" id="date-card-section">
    <div class="date-card-inner">
      <span class="date-card-icon">📅</span>
      <div>
        <div class="date-card-label">日付（タップして変更）</div>
        <div class="date-card-text" id="date-card-text"></div>
      </div>
      <span class="existing-badge" id="existing-badge"></span>
    </div>
    <input type="date" id="report-date">
  </div>

  <div class="section">
    <div class="reporter-row" style="align-items:flex-start;flex-direction:column;gap:8px">
      <label>担当者 <span id="holiday-indicator" style="font-size:12px;font-weight:normal;color:#888;margin-left:8px"></span></label>
      <div id="legacy-reporter-note" style="display:none;font-size:13px;color:#8a6d3b;background:#fcf8e3;border-radius:8px;padding:8px 12px;width:100%">旧形式の日報です（報告者: <span id="legacy-reporter-name"></span>）。編集する場合は下から担当者を選び直してください。</div>
      <div id="workers-container" style="width:100%"></div>
      <button type="button" class="btn-add-shortage" id="btn-add-worker">＋ 担当者を追加</button>
    </div>
  </div>

  <div class="section">
    <div class="section-label">【特記事項】</div>
    <div id="residents-container"></div>
  </div>

  <div class="section">
    <div class="section-label">【不足品】</div>
    <div id="shortage-list"></div>
    <button type="button" class="btn-add-shortage" id="btn-add-shortage">＋ 項目を追加</button>
  </div>

  <div class="section">
    <div class="section-label">【写真】</div>
    <div class="photo-upload-area" id="photo-upload-area" onclick="document.getElementById('photo-input').click()">
      <div class="photo-upload-icon">📷</div>
      <p>タップして写真を追加（最大2枚）</p>
    </div>
    <input type="file" id="photo-input" accept="image/*" multiple>
    <div class="photo-preview-row" id="photo-preview-row"></div>
    <div class="photo-uploading" id="photo-uploading"></div>
  </div>

  <div class="draft-indicator" id="draft-indicator"></div>

  <div class="bottom-bar">
    <button class="btn-summary" onclick="showSummary()">📋 まとめを見る</button>
    <button class="btn-word" onclick="exportWord()">📄 Word出力</button>
  </div>

  <div id="modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeModal()">
    <div class="modal-box">
      <div class="modal-head">
        <h2>報告書 プレビュー</h2>
        <button class="btn-share" onclick="shareURL()">📤 URLをシェア</button>
        <button class="btn-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="summary-body"></div>
    </div>
  </div>

  <script>
    const GH_NAMES = [
      'こもれびホーム３−２',
      'こもれびホーム４',
      'こもれびホーム５−１',
      'こもれびホーム５−２',
      'こもれびホーム６',
      'こもれびホームマハロ'
    ];

    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const storage = db.storage;

    // ─── Photo state ──────────────────────────────────────
    let uploadedPhotos = []; // [{url, path}]

    function renderPhotoPreview() {
      const row = document.getElementById('photo-preview-row');
      const area = document.getElementById('photo-upload-area');
      row.innerHTML = '';
      uploadedPhotos.forEach((photo, idx) => {
        const wrap = document.createElement('div');
        wrap.className = 'photo-thumb-wrap';
        wrap.innerHTML = `
          <img src="${photo.url}" loading="lazy">
          <button class="btn-remove-photo" onclick="removePhoto(${idx})">✕</button>
        `;
        row.appendChild(wrap);
      });
      area.style.display = uploadedPhotos.length >= 2 ? 'none' : '';
    }

    async function removePhoto(idx) {
      const photo = uploadedPhotos[idx];
      await storage.from('report-photos').remove([photo.path]);
      uploadedPhotos.splice(idx, 1);
      renderPhotoPreview();
      scheduleAutoSave();
    }

    async function compressImage(file) {
      return new Promise(resolve => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          const MAX = 800;
          let w = img.width, h = img.height;
          if (w > MAX || h > MAX) {
            if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
            else { w = Math.round(w * MAX / h); h = MAX; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          URL.revokeObjectURL(url);
          canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.75);
        };
        img.src = url;
      });
    }

    function bindPhotoInput() {
      const input = document.getElementById('photo-input');
      input.addEventListener('change', async (e) => {
        const files = Array.from(e.target.files);
        // inputを即リセット（iOSで同じファイルを再選択できるように）
        e.target.value = '';

        const remaining = 2 - uploadedPhotos.length;
        if (!files.length || remaining <= 0) return;
        const toUpload = files.slice(0, remaining);

        const ind = document.getElementById('photo-uploading');
        ind.textContent = 'アップロード中...';

        for (const file of toUpload) {
          const compressed = await compressImage(file);
          const path = `gh${ghNum}/${dateEl.value}/${Date.now()}.jpg`;
          const { error } = await storage.from('report-photos').upload(path, compressed, { contentType: 'image/jpeg', upsert: false });
          if (error) {
            ind.style.color = '#e74c3c';
            ind.textContent = '⚠️ アップロード失敗: ' + error.message;
            setTimeout(() => { ind.textContent = ''; ind.style.color = ''; }, 4000);
            continue;
          }
          const { data } = storage.from('report-photos').getPublicUrl(path);
          uploadedPhotos.push({ url: data.publicUrl, path });
        }
        ind.textContent = '';
        renderPhotoPreview();
        scheduleAutoSave();
      });
    }

    const params = new URLSearchParams(location.search);
    const ghNum = params.get('gh');
    const ghName = ghNum ? (GH_NAMES[parseInt(ghNum) - 1] || `ホーム${ghNum}`) : '';

    // ─── GH Selection Screen ───────────────────────────────
    if (!ghNum) {
      const screen = document.getElementById('gh-select-screen');
      screen.style.display = 'flex';
      const btnsContainer = document.getElementById('gh-select-btns');
      GH_NAMES.forEach((name, idx) => {
        const btn = document.createElement('button');
        btn.className = 'gh-select-btn';
        btn.textContent = name;
        btn.onclick = () => {
          location.href = `report.html?gh=${idx + 1}`;
        };
        btnsContainer.appendChild(btn);
      });
    }
    const urlDate = params.get('date');

    function todayISO() {
      const t = new Date();
      return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
    }
    function getReiwaDate(isoDate) {
      const [y, m, d] = isoDate.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      const days = ['日','月','火','水','木','金','土'];
      return `令和${y - 2018}年${m}月${d}日（${days[dt.getDay()]}）`;
    }

    document.getElementById('gh-title').textContent = ghName;
    document.title = `${ghName} 業務日報`;

    const dateEl = document.getElementById('report-date');
    dateEl.value = urlDate || todayISO();
    let previousDate = dateEl.value;
    let saveTimer = null;
    // refreshDateDisplay()がupdateHolidayIndicator/renderWorkerRows経由で参照するため、初回呼び出しより前に宣言する（TDZ対策）
    let staffList = [];       // [{id,last_name,first_name,staff_type}]

    // ─── Residents ────────────────────────────────────────
    function autoExpand(el) {
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 'px';
    }

    // ─── Diaper Usage ─────────────────────────────────────
    let diaperItemsByResident = {}; // { residentId: [{id, name}] }
    let diaperUsageValues = {};     // { itemId: count }

    async function loadDiaperItemsForResidents(residentRows) {
      diaperItemsByResident = {};
      const ids = residentRows.map(r => r.id);
      if (ids.length === 0) return;
      const { data } = await db.from('diaper_items')
        .select('id, resident_id, name')
        .in('resident_id', ids).eq('active', true);
      (data || []).forEach(item => {
        if (!diaperItemsByResident[item.resident_id]) diaperItemsByResident[item.resident_id] = [];
        diaperItemsByResident[item.resident_id].push(item);
      });
    }

    function renderDiaperStepper(container, residentId) {
      const items = diaperItemsByResident[residentId] || [];
      items.forEach(item => {
        const row = document.createElement('div');
        row.className = 'diaper-stepper-row';
        row.dataset.itemId = item.id;
        const current = diaperUsageValues[item.id] || 0;
        row.innerHTML = `
          <span class="diaper-stepper-name">${item.name}</span>
          <button type="button" class="diaper-stepper-btn" data-op="minus">−</button>
          <span class="diaper-stepper-count">${current}</span>
          <button type="button" class="diaper-stepper-btn" data-op="plus">＋</button>
        `;
        row.querySelector('[data-op="minus"]').addEventListener('click', () => {
          const v = Math.max(0, (diaperUsageValues[item.id] || 0) - 1);
          diaperUsageValues[item.id] = v;
          row.querySelector('.diaper-stepper-count').textContent = v;
          scheduleAutoSave();
        });
        row.querySelector('[data-op="plus"]').addEventListener('click', () => {
          const v = (diaperUsageValues[item.id] || 0) + 1;
          diaperUsageValues[item.id] = v;
          row.querySelector('.diaper-stepper-count').textContent = v;
          scheduleAutoSave();
        });
        container.appendChild(row);
      });
    }

      container.innerHTML = '<div style="text-align:center;padding:20px;color:#aaa;font-size:14px">読み込み中...</div>';

      const { data } = await db.from('residents')

          </div>
        `;
        return;

      residentRows.forEach(r => {

        div.className = 'resident-entry';
        div.dataset.name = r.name;
        div.dataset.residentId = r.id;
        div.innerHTML = `
          <div class="resident-name-label">${r.name}</div>

    let shortageItems = []; // [{text, checked}]

    function renderShortageList() {

      list.innerHTML = '';

        const div = document.createElement('div');

    // ─── Workers (担当者＋勤務種別) ───────────────────
    const WORK_TYPES = [
      { v: 'weekday_night',     label: '平日夜勤',            holiday: false },
      { v: 'holiday_night',     label: '休日夜勤',            holiday: true },
      { v: 'holiday_day',       label: '休日日勤',            holiday: true },
      { v: 'holiday_day_night', label: '休日日勤＋休日夜勤',   holiday: true },
      { v: 'six_hour',          label: '6時間コース',         holiday: null },
    ];
    // staffList / holidaySet / workerRows はrefreshDateDisplay()初回呼び出しより前（dateEl初期化直後）で宣言済み

    async function initStaffAndHolidays() {
      const [staffRes, holRes] = await Promise.all([
        db.from('staff').select('*').eq('active', true).order('sort_order'),
        db.from('jp_holidays').select('holiday_date'),
      ]);
      staffList = staffRes.data || [];
      holidaySet = new Set((holRes.data || []).map(r => r.holiday_date));
    }

    function isHolidayISO(iso) {
      const d = new Date(iso + 'T00:00:00');
      return d.getDay() === 0 || d.getDay() === 6 || holidaySet.has(iso);
    }

    function staffById(id) { return staffList.find(s => s.id === id); }

    function currentReporterText() {
      const names = workerRows.map(r => staffById(r.staff_id))
        .filter(Boolean).map(s => `${s.last_name} ${s.first_name}`.trim());
      return names.join('、');
    }

    function updateHolidayIndicator() {
      const el = document.getElementById('holiday-indicator');
      const iso = dateEl.value;
      if (!iso) { el.textContent = ''; return; }
      if (isHolidayISO(iso)) {
        const d = new Date(iso + 'T00:00:00');
        el.textContent = d.getDay() === 0 || d.getDay() === 6 ? '（この日は休日です）' : '（この日は祝日・休日です）';
        el.style.color = '#c0392b';
      } else {
        el.textContent = '（この日は平日です）';
        el.style.color = '#888';
      }
    }

    function workerWarning(row) {
      if (!row.staff_id || !row.work_type) return '';
      const wt = WORK_TYPES.find(w => w.v === row.work_type);
      if (!wt || wt.holiday === null) return '';
      const hol = isHolidayISO(dateEl.value);
      if (hol && wt.holiday === false) return '⚠️ 休日に平日種別が選ばれています';
      if (!hol && wt.holiday === true) return '⚠️ 平日に休日種別が選ばれています';
      return '';
    }

      const box = document.getElementById('workers-container');
      box.innerHTML = '';

        const staff = staffById(row.staff_id);

        staffSel.innerHTML = '<option value="">担当者を選択</option>'
          + '<optgroup label="世話人">' + staffList.filter(s => s.staff_type === 'sewanin')

          + '<optgroup label="A職員（法人職員）">' + staffList.filter(s => s.staff_type === 'a_staff')
            .map(s => `<option value="${s.id}">${s.last_name} ${s.first_name}</option>`).join('') + '</optgroup>';
        staffSel.value = row.staff_id || '';
        staffSel.addEventListener('change', () => {
          row.staff_id = staffSel.value || null;
          const s = staffById(row.staff_id);
          if (s && s.staff_type === 'a_staff') row.work_type = null;
          renderWorkerRows();

        });
        const typeSel = document.createElement('select');
        typeSel.style.cssText = 'flex:1;min-width:130px;padding:10px;border:1.5px solid #ddd;border-radius:8px;font-size:15px;background:#fff';
        if (isA) {
          typeSel.innerHTML = '<option value="">—（委託料対象外）</option>';
          typeSel.disabled = true;
        } else {
          typeSel.innerHTML = '<option value="">勤務種別を選択</option>'

          typeSel.value = row.work_type || '';
        }
        typeSel.addEventListener('change', () => {
          row.work_type = typeSel.value || null;
          renderWorkerRows();
          scheduleAutoSave();
        });
        const del = document.createElement('button');
        del.type = 'button';
        del.textContent = '✕';
        del.className = 'btn-remove-shortage';
        del.style.cssText = 'min-width:40px;min-height:40px;margin-left:4px';
        del.addEventListener('click', () => {

        if (isA) {

    // ─── Auto-save ────────────────────────────────────────
    function scheduleAutoSave() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveCurrentData, 800);
    }

    async function saveCurrentData() {
      return saveCurrentDataForDate(dateEl.value);
    }

    async function saveCurrentDataForDate(dateISO) {
      const reporter = currentReporterText();
      const workersData = workerRows
        .filter(r => r.staff_id)
        .map(r => {
          const s = staffById(r.staff_id);
          return { staff_id: r.staff_id, name: `${s.last_name} ${s.first_name}`.trim(),
                   staff_type: s.staff_type, work_type: s.staff_type === 'a_staff' ? null : r.work_type };
        });
      const shortageData = shortageItems
        .filter(item => item.text.trim())
        .map(item => ({ text: item.text.trim(), checked: item.checked || false }));
      const residentsData = {};
      let hasContent = shortageData.length > 0 || uploadedPhotos.length > 0 || workersData.length > 0;
      document.querySelectorAll('.resident-entry').forEach(entry => {
        const val = entry.querySelector('textarea').value;
        residentsData[entry.dataset.name] = val;
        if (val.trim()) hasContent = true;
      });
      // 短期入所枠（マハロのみ）
      document.querySelectorAll('.short-stay-entry').forEach(entry => {
        const key = entry.dataset.shortStayKey;
        const nameVal = entry.querySelector('input').value.trim();
        const textVal = entry.querySelector('textarea').value;
        residentsData[key + 'name'] = nameVal;
        residentsData[key] = textVal;
        if (nameVal || textVal.trim()) hasContent = true;
      });

      // 既存レコードがある場合は担当者名の変更（空欄含む）も保存する
      const { data: existing } = await db.from('reports').select('id')
        .eq('gh_num', parseInt(ghNum)).eq('report_date', dateISO).maybeSingle();

      // オムツ使用個数の保存（0のままの行はレコードを作らない。
      // 既に保存済みの日を0に直した場合は該当行をdeleteする＝入力取り消し）
      const diaperUpsertRows = [];
      const diaperDeleteItemIds = [];
      Object.entries(diaperUsageValues).forEach(([itemId, count]) => {
        if (count > 0) diaperUpsertRows.push({ item_id: itemId, usage_date: dateISO, count });
        else diaperDeleteItemIds.push(itemId);
      });
      if (diaperUpsertRows.length > 0) {
        const { error: diaperErr } = await db.from('diaper_usage')
          .upsert(diaperUpsertRows, { onConflict: 'item_id,usage_date' });
        if (diaperErr) console.error('diaper_usage upsert failed:', diaperErr.message);
      }
      if (diaperDeleteItemIds.length > 0) {
        const { error: diaperDelErr } = await db.from('diaper_usage')
          .delete().eq('usage_date', dateISO).in('item_id', diaperDeleteItemIds);
        if (diaperDelErr) console.error('diaper_usage delete failed:', diaperDelErr.message);
      }

      if (!hasContent && !existing) return;

      const { error } = await db.from('reports').upsert({
        gh_num: parseInt(ghNum),
        gh_name: ghName,
        report_date: dateISO,
        reporter: reporter,
        workers: workersData,
        residents: residentsData,
        shortage: shortageData,
        photos: uploadedPhotos.map(p => ({ url: p.url, path: p.path })),
        updated_at: new Date().toISOString()
      }, { onConflict: 'gh_num,report_date' });

      const ind = document.getElementById('draft-indicator');
      if (error) {
        ind.style.color = '#e74c3c';
        ind.textContent = '⚠️ 保存失敗: ' + error.message;
      } else {
        ind.style.color = '';
        ind.textContent = '保存しました ✓';
        document.getElementById('existing-badge').textContent = '記録あり ✓';
      }
      setTimeout(() => ind.textContent = '', 3000);
    }

    async function loadDateData(dateISO) {
      const { data } = await db.from('reports').select('*')
        .eq('gh_num', parseInt(ghNum))
        .eq('report_date', dateISO)
        .maybeSingle();

      document.getElementById('existing-badge').textContent = data ? '記録あり ✓' : '';

      const diaperItemIds = Object.values(diaperItemsByResident).flat().map(i => i.id);
      diaperUsageValues = {};
      if (diaperItemIds.length > 0) {
        const { data: usageRows } = await db.from('diaper_usage')
          .select('item_id, count').eq('usage_date', dateISO).in('item_id', diaperItemIds);
        (usageRows || []).forEach(u => { diaperUsageValues[u.item_id] = u.count; });
      }
      document.querySelectorAll('.diaper-stepper-row').forEach(row => {
        const v = diaperUsageValues[row.dataset.itemId] || 0;
        row.querySelector('.diaper-stepper-count').textContent = v;
      });

      if (data) {
        restoreWorkers(data);
        const rawS = data.shortage;
        const shortageArr2 = typeof rawS === 'string' ? JSON.parse(rawS || '[]') : (rawS || []);
        shortageItems = shortageArr2.map(item =>
          typeof item === 'string'
            ? { text: item, checked: false }
            : { text: item.text || '', checked: !!item.checked }
        );
        renderShortageList();
        document.querySelectorAll('.resident-entry').forEach(entry => {
          const ta = entry.querySelector('textarea');
          ta.value = (data.residents || {})[entry.dataset.name] || '';
          autoExpand(ta);
        });
        // 短期入所枠の復元
        document.querySelectorAll('.short-stay-entry').forEach(entry => {
          const key = entry.dataset.shortStayKey;
          entry.querySelector('input').value = (data.residents || {})[key + 'name'] || '';
          const ta = entry.querySelector('textarea');
          ta.value = (data.residents || {})[key] || '';
          autoExpand(ta);
        });
        uploadedPhotos = (data.photos || []).map(p => ({ url: p.url, path: p.path }));
        renderPhotoPreview();
      } else {
        restoreWorkers(null);
        shortageItems = [];
        renderShortageList();
        document.querySelectorAll('.resident-entry textarea').forEach(ta => {
          ta.value = '';
          ta.style.height = '';
        });
        document.querySelectorAll('.short-stay-entry').forEach(entry => {
          entry.querySelector('input').value = '';
          const ta = entry.querySelector('textarea');
          ta.value = '';
          ta.style.height = '';
        });
        uploadedPhotos = [];
        renderPhotoPreview();
      }
    }

    // ─── Word Export ──────────────────────────────────────
    let wordLibsLoaded = false;
    function loadWordLibs() {
      if (wordLibsLoaded) return Promise.resolve();
      return new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = 'https://unpkg.com/docx@9.7.1/dist/index.umd.cjs';
        s.onload = () => { wordLibsLoaded = true; res(); };
        s.onerror = rej;
        document.head.appendChild(s);
      });
    }

    async function exportWord() {
      try { await loadWordLibs(); } catch(e) { alert('Word出力ライブラリの読み込みに失敗しました'); return; }
      saveCurrentData();

      const reporter = currentReporterText() || document.getElementById('legacy-reporter-name').textContent || '';
      const dateStr = getReiwaDate(dateEl.value);
      const dateNum = dateEl.value.replace(/-/g,'');
      const safeName = ghName.replace(/[^　-鿿豈-﫿゠-ヿa-zA-Z0-9]/g,'');

      const { Document, Paragraph, TextRun, AlignmentType, HeadingLevel, Packer, BorderStyle, TableRow, TableCell, Table, WidthType } = docx;

      const FONT = 'MS Gothic';
      const pt = n => n * 2; // docx uses half-points

      // ヘッダー段落
      const headerParas = [
        new Paragraph({
          children: [new TextRun({ text: '業務日報', bold: true, size: pt(16), font: FONT })],
          alignment: AlignmentType.CENTER,
          spacing: { after: 80 },
        }),
        new Paragraph({
          children: [
            new TextRun({ text: `日付：${dateStr}　`, size: pt(11), font: FONT }),
            new TextRun({ text: `ホーム：${ghName}　`, size: pt(11), font: FONT }),
            new TextRun({ text: `報告者：${reporter}`, size: pt(11), font: FONT }),
          ],
          spacing: { after: 80 },
        }),
        new Paragraph({
          children: [new TextRun({ text: '管理者：　　　　　　　サービス管理責任者：', size: pt(11), font: FONT })],
          spacing: { after: 200 },
        }),
        new Paragraph({
          children: [new TextRun({ text: '【特記事項】', bold: true, size: pt(11), font: FONT })],
          spacing: { after: 80 },
        }),
      ];

      // 利用者ごとの段落
      const entryParas = [];
      document.querySelectorAll('.resident-entry').forEach(entry => {
        const name = entry.dataset.name;
        const prefix = `${name}さん‥`;
        const indent = '　'.repeat(prefix.length);
        const lines = (entry.querySelector('textarea').value || '').split('\n').filter((l, i) => i === 0 || l.trim() !== '');

        lines.forEach((line, i) => {
          entryParas.push(new Paragraph({
            children: [new TextRun({ text: (i === 0 ? prefix : indent) + line, size: pt(10.5), font: FONT })],
            spacing: { before: 0, after: 0 },
          }));
        });
        // 利用者間の空行
        entryParas.push(new Paragraph({ children: [new TextRun({ text: '' })], spacing: { after: 60 } }));
      });

      // 短期入所枠（マハロのみ）
      document.querySelectorAll('.short-stay-entry').forEach((entry, idx) => {
        const stayName = entry.querySelector('input').value.trim();
        const stayText = entry.querySelector('textarea').value || '';
        if (!stayName && !stayText.trim()) return;
        const prefix = `短期入所${'①②'[idx]}　${stayName || '（氏名未入力）'}さん‥`;
        const indent = '　'.repeat(prefix.length);
        const lines = stayText.split('\n').filter((l, i) => i === 0 || l.trim() !== '');
        lines.forEach((line, i) => {
          entryParas.push(new Paragraph({
            children: [new TextRun({ text: (i === 0 ? prefix : indent) + line, size: pt(10.5), font: FONT })],
            spacing: { before: 0, after: 0 },
          }));
        });
        entryParas.push(new Paragraph({ children: [new TextRun({ text: '' })], spacing: { after: 60 } }));
      });

      const doc = new Document({
        sections: [{
          properties: {},
          children: [...headerParas, ...entryParas],
        }],
      });

      try {
        const blob = await Packer.toBlob(doc);
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${safeName}_業務日報_${dateNum}.docx`;
        a.click();
        URL.revokeObjectURL(a.href);
      } catch(e) {
        alert('Word出力に失敗しました。\n' + e);
      }
    }

    // ─── Init (parallel fetch) ────────────────────────────
    async function init() {
      const dateISO = dateEl.value;
      const container = document.getElementById('residents-container');
      container.innerHTML = '<div style="text-align:center;padding:20px;color:#aaa;font-size:14px">読み込み中...</div>';

      await initStaffAndHolidays();
      updateHolidayIndicator();

      const [{ data: residentsData }, { data: reportData }] = await Promise.all([
        db.from('residents').select('name').eq('gh_num', parseInt(ghNum)).eq('active', true).order('sort_order'),
        db.from('reports').select('*').eq('gh_num', parseInt(ghNum)).eq('report_date', dateISO).maybeSingle()
      ]);

      // Render residents
      const residentNames = (residentsData || []).map(r => r.name);
      container.innerHTML = '';
      if (residentNames.length === 0) {
        container.innerHTML = `
          <div class="no-residents">
            <p>利用者が登録されていません</p>
            <p style="font-size:13px;color:#aaa;margin-top:8px">管理者ページから利用者を登録してください</p>
          </div>`;
      } else {
        residentNames.forEach(name => {
          const div = document.createElement('div');
          div.className = 'resident-entry';
          div.dataset.name = name;
          div.innerHTML = `
            <div class="resident-name-label">${name}</div>
            <textarea placeholder="${name}の様子を記入（帰宅〜朝の流れ）..."></textarea>
          `;
          container.appendChild(div);
        });
        container.querySelectorAll('textarea').forEach(ta => {
          ta.addEventListener('input', function() { autoExpand(this); scheduleAutoSave(); });
        });
      }

      // マハロ（gh=6）の場合は短期入所枠を追加
      if (parseInt(ghNum) === 6) {
        const section = document.createElement('div');
        section.className = 'short-stay-section';
        section.innerHTML = '<div class="short-stay-title">短期入所</div>';
        [1, 2].forEach(n => {
          const entry = document.createElement('div');
          entry.className = 'short-stay-entry';
          entry.dataset.shortStayKey = `__short_stay_${n}__`;
          entry.innerHTML = `
            <div class="short-stay-name-row">
              <span class="short-stay-label">短期入所${['①','②'][n-1]}</span>
              <input type="text" class="short-stay-name-input" placeholder="氏名を入力">
            </div>
            <textarea placeholder="様子を記入（帰宅〜朝の流れ）..."></textarea>
          `;
          entry.querySelector('input').addEventListener('input', scheduleAutoSave);
          entry.querySelector('textarea').addEventListener('input', function() { autoExpand(this); scheduleAutoSave(); });
          section.appendChild(entry);
        });
        container.appendChild(section);
      }

      // Apply saved report data
      document.getElementById('existing-badge').textContent = reportData ? '記録あり ✓' : '';
      if (reportData) {
        restoreWorkers(reportData);
        const rawShortage = reportData.shortage;
        const shortageArr = typeof rawShortage === 'string' ? JSON.parse(rawShortage || '[]') : (rawShortage || []);
        shortageItems = shortageArr.map(item =>
          typeof item === 'string' ? { text: item, checked: false } : { text: item.text || '', checked: !!item.checked }
        );
        renderShortageList();
        document.querySelectorAll('.resident-entry').forEach(entry => {
          const ta = entry.querySelector('textarea');
          ta.value = (reportData.residents || {})[entry.dataset.name] || '';
          autoExpand(ta);
        });
        // 短期入所枠の復元
        document.querySelectorAll('.short-stay-entry').forEach(entry => {
          const key = entry.dataset.shortStayKey;
          const nameInput = entry.querySelector('input');
          const ta = entry.querySelector('textarea');
          nameInput.value = (reportData.residents || {})[key + 'name'] || '';
          ta.value = (reportData.residents || {})[key] || '';
          autoExpand(ta);
        });
        uploadedPhotos = (reportData.photos || []).map(p => ({ url: p.url, path: p.path }));
        renderPhotoPreview();
      } else {
        restoreWorkers(null);
        shortageItems = [];
        renderShortageList();
        uploadedPhotos = [];
        renderPhotoPreview();
      }
    }
    bindPhotoInput();
    init();
  </script>
</body>
</html>
