<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>業務日報 入力</title>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="diaper-logic.js?v=2"></script>
  <script src="scripts/report_guard.js?v=1"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', 'Yu Gothic', sans-serif;
      background: #eef2f7;
      min-height: 100vh;
      padding-bottom: 120px;
    }

    .page-header {
      background: #4a90d9;
      color: white;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .page-header a { color: white; text-decoration: none; font-size: 26px; line-height: 1; }
    .page-header .h-info h1 { font-size: 16px; font-weight: bold; line-height: 1.3; }
    .page-header .h-info .sub { font-size: 12px; opacity: 0.85; margin-top: 2px; }

    .section {
      background: white;
      margin: 14px 16px;
      border-radius: 12px;
      padding: 16px 18px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .section-label {
      font-size: 13px;
      font-weight: bold;
      color: #4a90d9;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid #eef2f7;
    }

    .date-card-section {
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 14px;
      position: relative;
      overflow: hidden;
    }
    .date-card-section:active { background: #f0f6ff; }
    .date-card-inner {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
    }
    .date-card-icon { font-size: 26px; flex-shrink: 0; }
    .date-card-label { font-size: 12px; color: #7a8a9a; margin-bottom: 3px; }
    .date-card-text { font-size: 17px; font-weight: bold; color: #1a2a3a; }
    .existing-badge {
      margin-left: auto;
      font-size: 12px;
      color: #2ecc71;
      font-weight: bold;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #report-date {
      position: absolute;
      opacity: 0;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      cursor: pointer;
      z-index: 10;
    }

    .reporter-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .reporter-row label {
      font-size: 14px;
      color: #5a6a7a;
      font-weight: bold;
      white-space: nowrap;
    }
    .reporter-input {
      flex: 1;
      padding: 11px 14px;
      border: 1.5px solid #d0d8e8;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      color: #1a2a3a;
    }
    .reporter-input:focus {
      outline: none;
      border-color: #4a90d9;
      box-shadow: 0 0 0 3px rgba(74,144,217,0.15);
    }

    .resident-entry {
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid #f0f2f5;
    }
    .resident-entry:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

    .resident-name-label {
      font-size: 15px;
      font-weight: bold;
      color: #1a2a3a;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .resident-name-label::before { content: '・'; color: #4a90d9; font-size: 20px; line-height: 1; }

    .diaper-stepper-row {
      display: flex; align-items: center; gap: 10px;
      margin-top: 8px; padding: 8px 10px;
      background: #f8f9fa; border-radius: 8px; font-size: 13px; color: #3a4a5a;
    }
    .diaper-stepper-name { flex: 1; }
    .diaper-stepper-btn {
      width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid #4a90d9;
      background: white; color: #4a90d9; font-size: 20px; font-weight: bold;
      line-height: 1; cursor: pointer; flex-shrink: 0;
    }
    .diaper-stepper-btn:active { background: #eef6ff; }
    .diaper-stepper-count { min-width: 24px; text-align: center; font-weight: bold; }
    /* 在庫が少ないときだけ出るバッジ。色は管理画面と同じ意味（赤=残7日以内・黄=残14日以内）。
       色だけに頼らずテキスト「残り少」を必ず伴う。 */
    .diaper-low-badge {
      display: inline-block; margin-left: 6px; padding: 4px 10px;
      border-radius: 10px; font-size: 11px; font-weight: bold; white-space: nowrap;
      vertical-align: 1px; font-family: inherit; cursor: pointer; border: none;
    }
    .diaper-low-badge:disabled { opacity: 0.55; cursor: default; }
    .diaper-low-badge.red { background: #c0392b; color: #fff; }
    .diaper-low-badge.yellow { background: #fff3e0; color: #96610a; border: 1px solid #f0cf9a; }

    textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #d0d8e8;
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      color: #1a2a3a;
      line-height: 1.8;
      resize: none;
      overflow: hidden;
      min-height: 100px;
    }
    textarea:focus {
      outline: none;
      border-color: #4a90d9;
      box-shadow: 0 0 0 3px rgba(74,144,217,0.15);
    }
    textarea::placeholder { color: #bbc; }

    .no-residents { text-align: center; padding: 20px 0; }
    .no-residents p { color: #999; margin-bottom: 14px; }

    .short-stay-section {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 2px dashed #d0d8e8;
    }
    .short-stay-title {
      font-size: 13px;
      font-weight: bold;
      color: #7a8a9a;
      margin-bottom: 14px;
      letter-spacing: 0.05em;
    }
    .short-stay-entry {
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid #f0f2f5;
    }
    .short-stay-entry:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .short-stay-name-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .short-stay-label {
      font-size: 14px;
      font-weight: bold;
      color: #4a90d9;
      white-space: nowrap;
    }
    .short-stay-name-input {
      flex: 1;
      padding: 6px 10px;
      border: 1.5px solid #d0d8e8;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      color: #1a2a3a;
    }
    .short-stay-name-input:focus {
      outline: none;
      border-color: #4a90d9;
      box-shadow: 0 0 0 3px rgba(74,144,217,0.15);
    }
    .btn-go-settings {
      display: inline-block;
      padding: 11px 22px;
      background: #4a90d9;
      color: white;
      border-radius: 10px;
      text-decoration: none;
      font-size: 15px;
      font-weight: bold;
    }

    .bottom-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: white;
      padding: 12px 16px 28px;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.1);
      display: flex;
      gap: 12px;
    }
    .btn-summary {
      flex: 1;
      padding: 14px;
      background: white;
      border: 2px solid #4a90d9;
      border-radius: 12px;
      color: #4a90d9;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-word {
      flex: 1;
      padding: 14px;
      background: #4a90d9;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-word:active { background: #3a7bc8; }
    .btn-summary:active { background: #f0f6ff; }

    .draft-indicator {
      font-size: 11px;
      color: #4a90d9;
      text-align: right;
      padding: 4px 16px 0;
      opacity: 0.7;
      height: 20px;
    }

    /* ロード未完了・失敗時の全体ガード表示（2026-09-04 空上書き防止） */
    .load-guard-banner {
      display: none;
      background: #fdecea;
      color: #c0392b;
      font-size: 13px;
      font-weight: bold;
      text-align: center;
      padding: 10px 16px;
      margin: 0 16px 14px;
      border-radius: 10px;
      border: 1.5px solid #f0b8b0;
    }
    .load-guard-banner.is-visible { display: block; }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      display: flex;
      align-items: flex-end;
    }
    .modal-box {
      background: white;
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
    }
    .modal-head {
      padding: 14px 16px;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }
    .modal-head h2 { font-size: 15px; font-weight: bold; flex: 1; }
    .btn-share {
      padding: 8px 14px;
      background: #2ecc71;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .btn-share:active { background: #27ae60; }
    .btn-close {
      flex-shrink: 0;
      background: #f0f0f0;
      border: none;
      border-radius: 50%;
      width: 32px; height: 32px;
      font-size: 16px;
      cursor: pointer;
    }
    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      -webkit-overflow-scrolling: touch;
    }

    .s-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 18px; }
    .s-table td { border: 1.5px solid #333; padding: 8px 10px; vertical-align: middle; }
    .s-gh-name { text-align: center; font-size: 17px; font-weight: bold; }
    .s-sig-head { text-align: center; font-size: 11px; color: #555; background: #f8f8f8; }
    .s-sig-box { height: 44px; }
    .s-sec-title {
      font-weight: bold; font-size: 14px;
      margin: 16px 0 10px;
      padding: 6px 12px;
      background: #f0f6ff;
      border-left: 4px solid #4a90d9;
      border-radius: 0 6px 6px 0;
    }
    .s-resident { margin-bottom: 14px; }
    .s-resident .r-name { font-weight: bold; font-size: 14px; margin-bottom: 4px; }
    .s-resident .r-name::before { content: '・'; color: #4a90d9; }
    .s-resident .r-text {
      font-size: 13px; line-height: 1.8; white-space: pre-wrap;
      background: #f9f9f9; padding: 10px 14px; border-radius: 8px;
    }

    /* SHORTAGE LIST */
    .shortage-item-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .shortage-bullet { color: #4a90d9; font-size: 18px; flex-shrink: 0; }
    .shortage-item-input {
      flex: 1;
      padding: 10px 12px;
      border: 1.5px solid #d0d8e8;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      color: #1a2a3a;
    }
    .shortage-item-input:focus { outline: none; border-color: #4a90d9; }
    .btn-remove-shortage {
      width: 28px; height: 28px;
      background: #f0f0f0;
      border: none;
      border-radius: 50%;
      font-size: 14px;
      cursor: pointer;
      flex-shrink: 0;
      color: #888;
    }
    .btn-remove-shortage:active { background: #ffecec; color: #e74c3c; }
    /* 個人の希望品（各利用者ブロックの下部・蓄積型: 2026-09-04）。読み取り専用リスト＋追加のみ */
    .personal-items-block { margin-top: 8px; padding-top: 6px; border-top: 1px dashed #dde3ea; }
    .personal-items-label { font-size: 12px; font-weight: bold; color: #5b6b82; margin-bottom: 4px; }
    .personal-items-empty { font-size: 12px; color: #9aa5b3; padding: 4px 0; }
    .personal-item-row {
      display: flex; align-items: baseline; gap: 6px; margin-bottom: 4px; font-size: 13px;
    }
    .personal-item-text { flex: 1; color: #1a2a3a; }
    .personal-item-date { font-size: 11px; color: #8a97a8; flex-shrink: 0; }
    .personal-item-add-row { display: flex; gap: 6px; margin-top: 6px; }
    .personal-item-input {
      flex: 1; padding: 8px 10px; border: 1.5px solid #d0d8e8; border-radius: 8px;
      font-size: 13px; font-family: inherit; color: #1a2a3a;
    }
    .personal-item-input:focus { outline: none; border-color: #4a90d9; }
    .btn-add-personal-item {
      min-height: 40px; padding: 8px 14px; font-size: 13px; font-weight: bold;
      color: #2f6fb8; background: #f0f6ff; border: 1.5px dashed #4a90d9;
      border-radius: 8px; font-family: inherit; cursor: pointer; flex-shrink: 0;
    }
    .btn-add-personal-item:active { background: #e3eefb; }
    .btn-add-personal-item:disabled, .personal-item-input:disabled { opacity: 0.5; cursor: not-allowed; }
    .personal-item-add-error { font-size: 12px; color: #c0392b; margin-top: 4px; }
    .personal-items-unavailable-msg { font-size: 12px; color: #c0392b; margin-top: 4px; }
    .personal-items-block.is-unavailable .personal-items-list,
    .personal-items-block.is-unavailable .personal-item-add-row { opacity: 0.5; }
    .btn-add-shortage {
      margin-top: 8px;
      padding: 10px 16px;
      background: #f0f6ff;
      border: 1.5px dashed #4a90d9;
      border-radius: 8px;
      color: #4a90d9;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      width: 100%;
    }
    .btn-add-shortage:active { background: #e0eeff; }

    /* PHOTO UPLOAD */
    .photo-upload-area {
      border: 2px dashed #c0d4f0;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      background: #f8fbff;
      transition: border-color 0.2s;
      margin-bottom: 14px;
    }
    .photo-upload-area:active { border-color: #4a90d9; background: #eef6ff; }
    .photo-upload-area p { font-size: 14px; color: #7a8a9a; margin-top: 8px; }
    .photo-upload-icon { font-size: 36px; }
    #photo-input { display: none; }
    .photo-preview-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .photo-thumb-wrap {
      position: relative;
      width: calc(50% - 6px);
    }
    .photo-thumb-wrap img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      border-radius: 10px;
      display: block;
    }
    .btn-remove-photo {
      position: absolute;
      top: 6px; right: 6px;
      width: 26px; height: 26px;
      background: rgba(0,0,0,0.55);
      color: white;
      border: none;
      border-radius: 50%;
      font-size: 14px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .photo-uploading {
      font-size: 12px; color: #4a90d9;
      text-align: center; padding: 6px 0;
    }

    /* GH SELECTION SCREEN */
    .gh-select-screen {
      position: fixed; inset: 0;
      background: #2c3e50; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .gh-select-box {
      background: white; border-radius: 20px;
      padding: 32px 24px; width: 100%; max-width: 360px;
      text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .gh-select-box h2 {
      font-size: 18px; color: #1a2a3a; margin-bottom: 6px;
    }
    .gh-select-box p {
      font-size: 13px; color: #7a8a9a; margin-bottom: 24px;
    }
    .gh-select-btns { display: flex; flex-direction: column; gap: 10px; }
    .gh-select-btn {
      width: 100%; padding: 14px;
      background: #f0f6ff; border: 1.5px solid #c0d4f0;
      border-radius: 12px; font-size: 15px; font-weight: bold;
      color: #2c3e50; font-family: inherit; cursor: pointer;
      text-align: left; transition: all 0.12s;
    }
    .gh-select-btn:active { background: #4a90d9; color: white; border-color: #4a90d9; }
  </style>
</head>
<body>

  <!-- GH Selection Screen -->
  <div id="gh-select-screen" class="gh-select-screen" style="display:none">
    <div class="gh-select-box">
      <h2>🏠 業務日報</h2>
      <p>担当するホームを選んでください</p>
      <div class="gh-select-btns" id="gh-select-btns"></div>
    </div>
  </div>

  <div class="page-header">
    <a href="index.html">←</a>
    <div class="h-info">
      <h1 id="gh-title">ホーム</h1>
      <div class="sub" id="date-display"></div>
    </div>
  </div>

  <div class="load-guard-banner" id="load-guard-banner"></div>

  <div class="section date-card-section" id="date-card-section">
    <div class="date-card-inner">
      <span class="date-card-icon">📅</span>
      <div>
        <div class="date-card-label">日付（タップして変更）</div>
        <div class="date-card-text" id="date-card-text"></div>
      </div>
      <span class="existing-badge" id="existing-badge"></span>
    </div>
    <input type="date" id="report-date">
  </div>

  <div class="section">
    <div class="reporter-row" style="align-items:flex-start;flex-direction:column;gap:8px">
      <label>担当者 <span id="holiday-indicator" style="font-size:12px;font-weight:normal;color:#888;margin-left:8px"></span></label>
      <div id="legacy-reporter-note" style="display:none;font-size:13px;color:#8a6d3b;background:#fcf8e3;border-radius:8px;padding:8px 12px;width:100%">旧形式の日報です（報告者: <span id="legacy-reporter-name"></span>）。編集する場合は下から担当者を選び直してください。</div>
      <div id="workers-container" style="width:100%"></div>
      <button type="button" class="btn-add-shortage" id="btn-add-worker">＋ 担当者を追加</button>
    </div>
  </div>

  <div class="section">
    <div class="section-label">【特記事項】</div>
    <div id="residents-container"></div>
  </div>

  <div class="section">
    <div class="section-label">【不足品】</div>
    <div id="shortage-list"></div>
    <button type="button" class="btn-add-shortage" id="btn-add-shortage">＋ 項目を追加</button>
  </div>

  <div class="section">
    <div class="section-label">【写真】</div>
    <div class="photo-upload-area" id="photo-upload-area" onclick="document.getElementById('photo-input').click()">
      <div class="photo-upload-icon">📷</div>
      <p>タップして写真を追加（最大2枚）</p>
    </div>
    <input type="file" id="photo-input" accept="image/*" multiple>
    <div class="photo-preview-row" id="photo-preview-row"></div>
    <div class="photo-uploading" id="photo-uploading"></div>
  </div>

  <div class="draft-indicator" id="draft-indicator"></div>

  <div class="bottom-bar">
    <button class="btn-summary" onclick="showSummary()">📋 まとめを見る</button>
    <button class="btn-word" onclick="exportWord()">📄 Word出力</button>
  </div>

  <div id="modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeModal()">
    <div class="modal-box">
      <div class="modal-head">
        <h2>報告書 プレビュー</h2>
        <button class="btn-share" onclick="shareURL()">📤 URLをシェア</button>
        <button class="btn-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="summary-body"></div>
    </div>
  </div>

  <script>
    const GH_NAMES = [
      'こもれびホーム３−２',
      'こもれびホーム４',
      'こもれびホーム５−１',
      'こもれびホーム５−２',
      'こもれびホーム６',
      'こもれびホームマハロ'
    ];

    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const storage = db.storage;

    // ─── Photo state ──────────────────────────────────────
    let uploadedPhotos = []; // [{url, path}]

    function renderPhotoPreview() {
      const row = document.getElementById('photo-preview-row');
      const area = document.getElementById('photo-upload-area');
      row.innerHTML = '';
      uploadedPhotos.forEach((photo, idx) => {
        const wrap = document.createElement('div');
        wrap.className = 'photo-thumb-wrap';
        wrap.innerHTML = `
          <img src="${photo.url}" loading="lazy">
          <button class="btn-remove-photo" onclick="removePhoto(${idx})">✕</button>
        `;
        row.appendChild(wrap);
      });
      area.style.display = uploadedPhotos.length >= 2 ? 'none' : '';
    }

    async function removePhoto(idx) {
      const photo = uploadedPhotos[idx];
      await storage.from('report-photos').remove([photo.path]);
      uploadedPhotos.splice(idx, 1);
      renderPhotoPreview();
      scheduleAutoSave();
    }

    async function compressImage(file) {
      return new Promise(resolve => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          const MAX = 800;
          let w = img.width, h = img.height;
          if (w > MAX || h > MAX) {
            if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
            else { w = Math.round(w * MAX / h); h = MAX; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          URL.revokeObjectURL(url);
          canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.75);
        };
        img.src = url;
      });
    }

    // 在庫の残り具合を判定する。管理画面と同じ diaper-logic.js を使うので判定がズレない。
    // 失敗しても日報入力は従来通り動かす（バッジが出ないだけ）＝在庫表示のせいで日報が書けなくなるのを防ぐ。
    async function loadDiaperStock() {
      diaperStatusByItem = {};
      try {
        const itemIds = Object.values(diaperItemsByResident).flat().map(i => i.id);
        if (itemIds.length === 0) return;
        // ⚠️ 行数を無制限に増やさないこと。PostgRESTには db-max-rows のサーバー側ハード上限があり、
        //    クライアントの .limit() では超えられない（上限変更はSupabaseダッシュボード側の設定）。
        //    上限に達すると古い行が無言で切り捨てられ、在庫が「実際より多い」方向に狂う
        //    ＝在庫切れに気づけない側に倒れるため、取得範囲そのものを増えない形にする。
        // usageの必要範囲は「最新の棚卸し以降」と「直近14日」のうち古い方まで。
        //  - computeStock: 最新の棚卸し以降の全usageが必要（14日で切ると在庫を過大評価する）
        //  - avgDaily: 直近14日のみ使用
        const evRes = await db.from('diaper_events')
          .select('item_id, type, pieces, event_date').in('item_id', itemIds);
        if (evRes.error) {
          console.error('オムツ在庫の取得に失敗（バッジ非表示で続行）:', evRes.error);
          diaperStatusByItem = {}; return;
        }
        const t0 = new Date(); t0.setDate(t0.getDate() - 13);
        let usageFrom = `${t0.getFullYear()}-${String(t0.getMonth()+1).padStart(2,'0')}-${String(t0.getDate()).padStart(2,'0')}`;
        const adjustDates = (evRes.data || []).filter(e => e.type === 'adjust').map(e => e.event_date);
        if (adjustDates.length > 0) {
          const oldestNeeded = adjustDates.sort()[0];   // 品目ごとに最新棚卸し日が違うので最も古いものに合わせる
          if (oldestNeeded < usageFrom) usageFrom = oldestNeeded;
        } else {
          usageFrom = null;  // 棚卸しが1件もない＝基準0枚から全usageを引く必要がある
        }
        let usQuery = db.from('diaper_usage').select('item_id, usage_date, count').in('item_id', itemIds);
        if (usageFrom) usQuery = usQuery.gte('usage_date', usageFrom);
        const usRes = await usQuery;
        // supabase-jsは失敗時にthrowせず{data:null,error}を返すのでcatchでは捕まらない。
        // 取得が欠けたまま判定すると、在庫が十分でも全品目が赤になりうる（events欠落で在庫がマイナスになる）。
        // 不正確な警告は現場の信用を失うので、失敗したらバッジを一切出さない。
        if (usRes.error) {
          console.error('オムツ在庫の取得に失敗（バッジ非表示で続行）:', usRes.error);
          diaperStatusByItem = {};
          return;
        }
        const events = evRes.data, usages = usRes.data;
        const t = new Date();
        const today = `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
        itemIds.forEach(id => {
          const ev = (events || []).filter(e => e.item_id === id);
          const us = (usages || []).filter(u => u.item_id === id);
          const stock = DiaperLogic.computeStock(ev, us);
          const days = DiaperLogic.daysLeft(stock, DiaperLogic.avgDaily(us, today));
          diaperStatusByItem[id] = DiaperLogic.statusOf(days);
        });
      } catch (e) {
        console.error('オムツ在庫の取得に失敗（バッジ非表示で続行）:', e);
        diaperStatusByItem = {};
      }
    }

    async function loadPersonalItemsOnce() {
      // GHごとに1回だけ。日付切替では呼ばない（このコメントを見て日付切替ハンドラから
      // 呼び出しを追加しないこと。呼ぶと「日付に依存しない」設計が壊れる）。
      // ネットワーク例外・supabase-js内部エラー等でここが投げた場合、呼び出し元でawaitしていないと
      // 未処理rejectionになり「追加ボタンが永久にdisabledのまま赤帯も出ない」事故になる
      // （2026-09-04 code-review指摘）。error分岐と同じ失敗経路に合流させ、必ず赤帯を出す。
      setPersonalItemsLoadingDisabled(true);
      try {
        const { data, error } = await db.from('personal_shortage_items')
          .select('id, resident_id, resident_name, item_text, requested_on')
          .eq('gh_num', parseInt(ghNum)).is('purchased_at', null)
          .order('resident_id').order('requested_on').order('id');
        if (error) throw error;
        const next = {};
        (data || []).forEach(row => {
          const rid = String(row.resident_id);
          if (!next[rid]) next[rid] = [];
          next[rid].push({ id: row.id, text: row.item_text, requestedOn: row.requested_on });
        });
        personalItemsByResident = next;
        personalItemsLoaded = true;
        personalItemsUnavailable = false;
        document.querySelectorAll('.personal-items-block').forEach(block => renderPersonalItemsList(block));
        setPersonalItemsUnavailable(false);
        setPersonalItemsLoadingDisabled(false);
      } catch (err) {
        console.error('personal_shortage_items load failed:', err && err.message);
        personalItemsByResident = {};
        personalItemsLoaded = false;
        personalItemsUnavailable = true;
        setPersonalItemsUnavailable(true);
      }
    }

    function fmtMD(dateISOStr) {
      const [, m, d] = (dateISOStr || '').split('-');

      return `${parseInt(m, 10)}/${parseInt(d, 10)}`;

    async function addPersonalItem(block) {
      const residentId = block.dataset.residentId;
      const residentName = block.dataset.residentName;
      const input = block.querySelector('.personal-item-input');
      const addBtn = block.querySelector('.btn-add-personal-item');
      const errEl = block.querySelector('.personal-item-add-error');
      const text = input.value.trim();
      if (!text) return;
      // 同じ利用者の未購入リストに同名（trim後の完全一致）が既にあれば重複INSERTしない
      // （ネイト精査指摘・2026-09-04）。サーバー側にはunique制約が無いため、フロント側で防ぐ。
      const existingItems = personalItemsByResident[residentId] || [];
      if (existingItems.some(it => it.text === text)) {
        errEl.style.display = '';
        errEl.textContent = 'すでに登録されています';
        // 入力値は残す（設計書§4と同じ方針）
        return;
      }
      addBtn.disabled = true;
      input.disabled = true;
      errEl.style.display = 'none';
      const { data, error } = await db.from('personal_shortage_items').insert({
        gh_num: parseInt(ghNum),
        resident_id: parseInt(residentId, 10), // 数値に正規化（09-03の文字列/数値二重キーバグの再発防止）
        resident_name: residentName,
        item_text: text,
      }).select('id, resident_id, resident_name, item_text, requested_on');
      addBtn.disabled = false;
      input.disabled = false;
      if (error || !data || !data[0]) {
        console.error('personal_shortage_items insert failed:', error && error.message);
        errEl.style.display = '';
        errEl.textContent = '追加できませんでした';
        // 入力値は残す（設計書§4）
        return;
      }
      const row = data[0];
      if (!personalItemsByResident[residentId]) personalItemsByResident[residentId] = [];
      personalItemsByResident[residentId].push({ id: row.id, text: row.item_text, requestedOn: row.requested_on });
      renderPersonalItemsList(block);
      input.value = '';
      input.focus();
    }

    function renderPersonalItems(container, residentIdArg, residentName) {
      const residentId = String(residentIdArg);
      const block = document.createElement('div');
      block.className = 'personal-items-block';
      block.dataset.residentId = residentId;

        </div>
        <div class="personal-item-add-error" style="display:none;"></div>
        <div class="personal-items-unavailable-msg" style="display:none;">希望品を読み込めませんでした。再読み込みしてください</div>
      `;
      const addBtn = block.querySelector('.btn-add-personal-item');
      const input = block.querySelector('.personal-item-input');
      addBtn.disabled = true; // 取得完了まで追加不可（設計書§4のガード）

        input.disabled = false;

      container.appendChild(block);

    // ─── Workers (担当者＋勤務種別) ───────────────────
    const WORK_TYPES = [
      { v: 'weekday_night',     label: '平日夜勤',            holiday: false },
      { v: 'holiday_night',     label: '休日夜勤',            holiday: true },
      { v: 'holiday_day',       label: '休日日勤',            holiday: true },
      { v: 'holiday_day_night', label: '休日日勤＋休日夜勤',   holiday: true },
      { v: 'six_hour',          label: '6時間コース',         holiday: null },
    ];
    // staffList / holidaySet / workerRows はrefreshDateDisplay()初回呼び出しより前（dateEl初期化直後）で宣言済み

    async function initStaffAndHolidays() {
      const [staffRes, holRes] = await Promise.all([
        db.from('staff').select('*').eq('active', true).order('sort_order'),
        db.from('jp_holidays').select('holiday_date'),
      ]);
      staffList = staffRes.data || [];
      holidaySet = new Set((holRes.data || []).map(r => r.holiday_date));
    }

    function isHolidayISO(iso) {
      const d = new Date(iso + 'T00:00:00');
      return d.getDay() === 0 || d.getDay() === 6 || holidaySet.has(iso);
    }

    function staffById(id) { return staffList.find(s => s.id === id); }

    function currentReporterText() {
      const names = workerRows.map(r => staffById(r.staff_id))
        .filter(Boolean).map(s => `${s.last_name} ${s.first_name}`.trim());
      return names.join('、');
    }

    function updateHolidayIndicator() {
      const el = document.getElementById('holiday-indicator');
      const iso = dateEl.value;
      if (!iso) { el.textContent = ''; return; }
      if (isHolidayISO(iso)) {
        const d = new Date(iso + 'T00:00:00');
        el.textContent = d.getDay() === 0 || d.getDay() === 6 ? '（この日は休日です）' : '（この日は祝日・休日です）';
        el.style.color = '#c0392b';
      } else {
        el.textContent = '（この日は平日です）';
        el.style.color = '#888';
      }
    }

    function workerWarning(row) {
      if (!row.staff_id || !row.work_type) return '';
      const wt = WORK_TYPES.find(w => w.v === row.work_type);
      if (!wt || wt.holiday === null) return '';
      const hol = isHolidayISO(dateEl.value);
      if (hol && wt.holiday === false) return '⚠️ 休日に平日種別が選ばれています';
      if (!hol && wt.holiday === true) return '⚠️ 平日に休日種別が選ばれています';
      return '';
    }

    function renderWorkerRows() {
      const box = document.getElementById('workers-container');
      box.innerHTML = '';
      workerRows.forEach((row, idx) => {
        const staff = staffById(row.staff_id);
        const isA = staff && staff.staff_type === 'a_staff';
        const div = document.createElement('div');
        div.style.cssText = 'display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap';
        const staffSel = document.createElement('select');
        staffSel.style.cssText = 'flex:1;min-width:130px;padding:10px;border:1.5px solid #ddd;border-radius:8px;font-size:15px;background:#fff';
        staffSel.innerHTML = '<option value="">担当者を選択</option>'
          + '<optgroup label="世話人">' + staffList.filter(s => s.staff_type === 'sewanin')
            .map(s => `<option value="${s.id}">${s.last_name} ${s.first_name}</option>`).join('') + '</optgroup>'
          + '<optgroup label="A職員（法人職員）">' + staffList.filter(s => s.staff_type === 'a_staff')
            .map(s => `<option value="${s.id}">${s.last_name} ${s.first_name}</option>`).join('') + '</optgroup>';
        staffSel.value = row.staff_id || '';
        staffSel.addEventListener('change', () => {
          row.staff_id = staffSel.value || null;
          const s = staffById(row.staff_id);
          if (s && s.staff_type === 'a_staff') row.work_type = null;
          renderWorkerRows();
          scheduleAutoSave();
        });
        const typeSel = document.createElement('select');
        typeSel.style.cssText = 'flex:1;min-width:130px;padding:10px;border:1.5px solid #ddd;border-radius:8px;font-size:15px;background:#fff';
        if (isA) {
          typeSel.innerHTML = '<option value="">—（委託料対象外）</option>';
          typeSel.disabled = true;
        } else {
          typeSel.innerHTML = '<option value="">勤務種別を選択</option>'
            + WORK_TYPES.map(w => `<option value="${w.v}">${w.label}</option>`).join('');
          typeSel.value = row.work_type || '';
        }
        typeSel.addEventListener('change', () => {
          row.work_type = typeSel.value || null;
          renderWorkerRows();
          scheduleAutoSave();
        });
        const del = document.createElement('button');
        del.type = 'button';
        del.textContent = '✕';
        del.className = 'btn-remove-shortage';
        del.style.cssText = 'min-width:40px;min-height:40px;margin-left:4px';
        del.addEventListener('click', () => {
          workerRows.splice(idx, 1);
          renderWorkerRows();
          scheduleAutoSave();
        });
        div.appendChild(staffSel);
        div.appendChild(typeSel);
        div.appendChild(del);
        if (isA) {
          const note = document.createElement('div');
          note.style.cssText = 'width:100%;font-size:11px;color:#888';
          note.textContent = 'A職員（法人職員）は法人から給与が支払われるため、委託料の勤務種別は記録しません';
          div.appendChild(note);

        const warn = workerWarning(row);
        if (warn) {
          const w = document.createElement('div');

    // ─── Auto-save ────────────────────────────────────────
    function scheduleAutoSave() {
      reportDirty = true;
      if (!ReportGuard.canSaveReport({ loadedFor: reportLoadedFor, dateISO: dateEl.value, dirty: reportDirty })) {
        // ロード未完了/失敗の日付に入力があった。偽の「保存しました」を出さず、保存もしない。
        setLoadGuardBanner('読み込み中です。表示が終わってから入力してください');
        return;
      }
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveCurrentData, 800);
    }

    async function saveCurrentData() {
      return saveCurrentDataForDate(dateEl.value);
    }

    async function saveCurrentDataForDate(dateISO) {
      const guardState = { loadedFor: reportLoadedFor, dateISO, dirty: reportDirty };
      if (!ReportGuard.canSaveReport(guardState)) {
        if (ReportGuard.shouldWarnUnsaved(guardState)) {
          setLoadGuardBanner('読み込み中です。表示が終わってから入力してください');
        }
        return;
      }
      const reporter = currentReporterText();
      const workersData = workerRows
        .filter(r => r.staff_id)
        .map(r => {
          const s = staffById(r.staff_id);
          return { staff_id: r.staff_id, name: `${s.last_name} ${s.first_name}`.trim(),
                   staff_type: s.staff_type, work_type: s.staff_type === 'a_staff' ? null : r.work_type };
        });
      const shortageData = shortageItems
        .filter(item => item.text.trim())
        .map(item => ({ text: item.text.trim(), checked: item.checked || false }));
      const residentsData = {};
      let hasContent = shortageData.length > 0 || uploadedPhotos.length > 0 || workersData.length > 0;
      document.querySelectorAll('.resident-entry').forEach(entry => {
        const val = entry.querySelector('textarea').value;
        residentsData[entry.dataset.name] = val;
        if (val.trim()) hasContent = true;
      });
      // 短期入所枠（マハロのみ）
      document.querySelectorAll('.short-stay-entry').forEach(entry => {
        const key = entry.dataset.shortStayKey;
        const nameVal = entry.querySelector('input').value.trim();
        const textVal = entry.querySelector('textarea').value;
        residentsData[key + 'name'] = nameVal;
        residentsData[key] = textVal;
        if (nameVal || textVal.trim()) hasContent = true;
      });

      // 送信直前（DOM値をスナップショットした直後）にdirtyを下ろす。
      // 保存成功後に下ろすと、送信中（await中）に打った最後の1文字がdirty=trueのまま
      // タイマーで次のsaveCurrentDataForDateが走った時にcanSaveがguardを通らず、
      // 未保存のまま「保存しました」だけ出る事故になる（2026-09-04 Getter指摘）。
      // 失敗時は下の各分岐でdirty=trueに戻し、次の自動保存タイマーで再送されるようにする。
      reportDirty = false;

      // 既存レコードがある場合は担当者名の変更（空欄含む）も保存する
      const { data: existing } = await db.from('reports').select('id')
        .eq('gh_num', parseInt(ghNum)).eq('report_date', dateISO).maybeSingle();

      // オムツ使用個数の保存（0のままの行はレコードを作らない。
      // 既に保存済みの日を0に直した場合は該当行をdeleteする＝入力取り消し）
      const diaperUpsertRows = [];
      const diaperDeleteItemIds = [];
      Object.entries(diaperUsageValues).forEach(([itemId, count]) => {
        if (count > 0) diaperUpsertRows.push({ item_id: itemId, usage_date: dateISO, count });
        else diaperDeleteItemIds.push(itemId);
      });
      let diaperSaveError = null;
      if (diaperUpsertRows.length > 0) {
        const { error: diaperErr } = await db.from('diaper_usage')
          .upsert(diaperUpsertRows, { onConflict: 'item_id,usage_date' });
        if (diaperErr) { console.error('diaper_usage upsert failed:', diaperErr.message); diaperSaveError = diaperErr; }
      }
      if (diaperDeleteItemIds.length > 0) {
        const { error: diaperDelErr } = await db.from('diaper_usage')
          .delete().eq('usage_date', dateISO).in('item_id', diaperDeleteItemIds);
        if (diaperDelErr) { console.error('diaper_usage delete failed:', diaperDelErr.message); diaperSaveError = diaperSaveError || diaperDelErr; }
      }

      if (!hasContent && !existing) {
        // 日報本文が空でもオムツだけ入力された日は保存結果をインジケーターに出す
        if (diaperUpsertRows.length > 0 || diaperDeleteItemIds.length > 0) {
          const ind = document.getElementById('draft-indicator');
          if (diaperSaveError) {
            ind.style.color = '#e74c3c';
            ind.textContent = '⚠️ 保存失敗: ' + diaperSaveError.message;
            reportDirty = true; // 失敗分を次の自動保存で再送できるようにする
          } else {
            ind.style.color = '';
            ind.textContent = '保存しました ✓';
          }
          setTimeout(() => ind.textContent = '', 3000);
        }
        return;
      }

      const { error } = await db.from('reports').upsert({
        gh_num: parseInt(ghNum),
        gh_name: ghName,
        report_date: dateISO,
        reporter: reporter,
        workers: workersData,
        residents: residentsData,
        shortage: shortageData,
        photos: uploadedPhotos.map(p => ({ url: p.url, path: p.path })),
        updated_at: new Date().toISOString()
      }, { onConflict: 'gh_num,report_date' });

      const ind = document.getElementById('draft-indicator');
      const saveFailure = error || diaperSaveError;
      if (saveFailure) {
        ind.style.color = '#e74c3c';
        ind.textContent = '⚠️ 保存失敗: ' + saveFailure.message;
        reportDirty = true; // 失敗分を次の自動保存で再送できるようにする
      } else {
        ind.style.color = '';
        ind.textContent = '保存しました ✓';
        document.getElementById('existing-badge').textContent = '記録あり ✓';
      }
      setTimeout(() => ind.textContent = '', 3000);
    }

    async function loadDateData(dateISO) {
      reportLoadedFor = null;
      reportDirty = false;
      setLoadGuardBanner(null);
      setFormInputsDisabled(true);
      const { data, error } = await db.from('reports').select('*')
        .eq('gh_num', parseInt(ghNum))
        .eq('report_date', dateISO)
        .maybeSingle();

      if (error) {
        console.error('reports load failed:', error.message);
        setFormInputsDisabled(true);
        setLoadGuardBanner('読み込みに失敗しました。再読み込みしてください（入力は保存されません）');
        return;
      }

      document.getElementById('existing-badge').textContent = data ? '記録あり ✓' : '';

      await loadDiaperUsage(dateISO);
      document.querySelectorAll('.diaper-stepper-row').forEach(row => {
        const v = diaperUsageValues[row.dataset.itemId] || 0;
        row.querySelector('.diaper-stepper-count').textContent = v;
      });

      if (data) {
        restoreWorkers(data);
        const rawS = data.shortage;
        const shortageArr2 = typeof rawS === 'string' ? JSON.parse(rawS || '[]') : (rawS || []);
        shortageItems = shortageArr2.map(item =>
          typeof item === 'string'
            ? { text: item, checked: false }
            : { text: item.text || '', checked: !!item.checked }
        );
        renderShortageList();
        document.querySelectorAll('.resident-entry').forEach(entry => {
          const ta = entry.querySelector('textarea');
          ta.value = (data.residents || {})[entry.dataset.name] || '';
          autoExpand(ta);
        });
        // 短期入所枠の復元
        document.querySelectorAll('.short-stay-entry').forEach(entry => {
          const key = entry.dataset.shortStayKey;
          entry.querySelector('input').value = (data.residents || {})[key + 'name'] || '';
          const ta = entry.querySelector('textarea');
          ta.value = (data.residents || {})[key] || '';
          autoExpand(ta);
        });
        uploadedPhotos = (data.photos || []).map(p => ({ url: p.url, path: p.path }));
        renderPhotoPreview();
      } else {
        restoreWorkers(null);
        shortageItems = [];
        renderShortageList();
        document.querySelectorAll('.resident-entry textarea').forEach(ta => {
          ta.value = '';
          ta.style.height = '';
        });
        document.querySelectorAll('.short-stay-entry').forEach(entry => {
          entry.querySelector('input').value = '';
          const ta = entry.querySelector('textarea');
          ta.value = '';
          ta.style.height = '';
        });
        uploadedPhotos = [];
        renderPhotoPreview();
      }
      // フォーム全体（担当者/特記事項/不足品/短期入所/写真/オムツ）の復元が
      // 完了した“ここ”で初めて保存可能にする。SELECT直後にreportLoadedForを立てると、
      // 復元用awaitの隙間（loadDiaperUsage）で打鍵された場合に
      // 半分だけ復元された状態のフォームで上書き保存が飛んでしまう
      // （2026-09-04 code-review指摘・防ぎたい事故そのもの）。
      // 個人の希望品（personal_shortage_items）はGHごとに1回だけ init() で取得する蓄積型のため、
      // 日付切替のたびに走るこのロードとは完全に独立している（このガードの対象外）。
      reportLoadedFor = dateISO;
      reportDirty = false; // ここでDOMはサーバー内容と一致済みなので、ロード中の入力(blocked)は破棄してよい
      setFormInputsDisabled(false);
      setLoadGuardBanner(null);
    }

    // ─── Word Export ──────────────────────────────────────
    let wordLibsLoaded = false;
    function loadWordLibs() {
      if (wordLibsLoaded) return Promise.resolve();
      return new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = 'https://unpkg.com/docx@9.7.1/dist/index.umd.cjs';
        s.onload = () => { wordLibsLoaded = true; res(); };
        s.onerror = rej;
        document.head.appendChild(s);
      });
    }

    async function exportWord() {
      try { await loadWordLibs(); } catch(e) { alert('Word出力ライブラリの読み込みに失敗しました'); return; }
      saveCurrentData();

      const reporter = currentReporterText() || document.getElementById('legacy-reporter-name').textContent || '';
      const dateStr = getReiwaDate(dateEl.value);
      const dateNum = dateEl.value.replace(/-/g,'');
      const safeName = ghName.replace(/[^　-鿿豈-﫿゠-ヿa-zA-Z0-9]/g,'');

      const { Document, Paragraph, TextRun, AlignmentType, HeadingLevel, Packer, BorderStyle, TableRow, TableCell, Table, WidthType } = docx;

      const FONT = 'MS Gothic';
      const pt = n => n * 2; // docx uses half-points

      // ヘッダー段落
      const headerParas = [
        new Paragraph({
          children: [new TextRun({ text: '業務日報', bold: true, size: pt(16), font: FONT })],
          alignment: AlignmentType.CENTER,
          spacing: { after: 80 },
        }),
        new Paragraph({
          children: [
            new TextRun({ text: `日付：${dateStr}　`, size: pt(11), font: FONT }),
            new TextRun({ text: `ホーム：${ghName}　`, size: pt(11), font: FONT }),
            new TextRun({ text: `報告者：${reporter}`, size: pt(11), font: FONT }),
          ],
          spacing: { after: 80 },
        }),
        new Paragraph({
          children: [new TextRun({ text: '管理者：　　　　　　　サービス管理責任者：', size: pt(11), font: FONT })],
          spacing: { after: 200 },
        }),
        new Paragraph({
          children: [new TextRun({ text: '【特記事項】', bold: true, size: pt(11), font: FONT })],
          spacing: { after: 80 },
        }),
      ];

      // 利用者ごとの段落
      const entryParas = [];
      document.querySelectorAll('.resident-entry').forEach(entry => {
        const name = entry.dataset.name;
        const prefix = `${name}さん‥`;
        const indent = '　'.repeat(prefix.length);
        const lines = (entry.querySelector('textarea').value || '').split('\n').filter((l, i) => i === 0 || l.trim() !== '');

        lines.forEach((line, i) => {
          entryParas.push(new Paragraph({
            children: [new TextRun({ text: (i === 0 ? prefix : indent) + line, size: pt(10.5), font: FONT })],
            spacing: { before: 0, after: 0 },
          }));
        });
        // 利用者間の空行
        entryParas.push(new Paragraph({ children: [new TextRun({ text: '' })], spacing: { after: 60 } }));
      });

      // 短期入所枠（マハロのみ）
      document.querySelectorAll('.short-stay-entry').forEach((entry, idx) => {
        const stayName = entry.querySelector('input').value.trim();
        const stayText = entry.querySelector('textarea').value || '';
        if (!stayName && !stayText.trim()) return;
        const prefix = `短期入所${'①②'[idx]}　${stayName || '（氏名未入力）'}さん‥`;
        const indent = '　'.repeat(prefix.length);
        const lines = stayText.split('\n').filter((l, i) => i === 0 || l.trim() !== '');
        lines.forEach((line, i) => {
          entryParas.push(new Paragraph({
            children: [new TextRun({ text: (i === 0 ? prefix : indent) + line, size: pt(10.5), font: FONT })],
            spacing: { before: 0, after: 0 },
          }));
        });
        entryParas.push(new Paragraph({ children: [new TextRun({ text: '' })], spacing: { after: 60 } }));
      });

      const doc = new Document({
        sections: [{
          properties: {},
          children: [...headerParas, ...entryParas],
        }],
      });

      try {
        const blob = await Packer.toBlob(doc);
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${safeName}_業務日報_${dateNum}.docx`;
        a.click();
        URL.revokeObjectURL(a.href);
      } catch(e) {
        alert('Word出力に失敗しました。\n' + e);
      }
    }

    // ─── Init (parallel fetch) ────────────────────────────
    async function init() {
      const dateISO = dateEl.value;
      const container = document.getElementById('residents-container');
      container.innerHTML = '<div style="text-align:center;padding:20px;color:#aaa;font-size:14px">読み込み中...</div>';
      reportLoadedFor = null;
      reportDirty = false;

      await initStaffAndHolidays();
      updateHolidayIndicator();

      const [{ data: residentsData }, { data: reportData, error: reportError }] = await Promise.all([
        db.from('residents').select('id, name').eq('gh_num', parseInt(ghNum)).eq('active', true).order('sort_order'),
        db.from('reports').select('*').eq('gh_num', parseInt(ghNum)).eq('report_date', dateISO).maybeSingle()
      ]);

      if (reportError) {
        console.error('reports load failed:', reportError.message);
        container.innerHTML = '<div style="text-align:center;padding:20px;color:#aaa;font-size:14px">読み込みに失敗しました</div>';
        setLoadGuardBanner('読み込みに失敗しました。再読み込みしてください（入力は保存されません）');
        setFormInputsDisabled(true);
        return;
      }

      // Render residents
      const residentRows = residentsData || [];
      // オムツ行と当日の使用実績を先に読み込んでからステッパー込みで描画する
      await loadDiaperItemsForResidents(residentRows);
      await Promise.all([loadDiaperUsage(dateISO), loadDiaperStock()]);
      // 個人の希望品はここで待たない（await しない）。resident-entry のDOMを先に描画し、
      // 「取得完了まで追加ボタンdisabled」を実際にユーザーへ見せてからバックグラウンドで反映する。
      // loadPersonalItemsOnce() 自体が例外を含めて全て内部でハンドリングするため、
      // ここでは戻り値のPromiseを保持・awaitする必要はない（意図的にfire-and-forget）。
      if (!personalItemsLoaded && !personalItemsUnavailable) {
        loadPersonalItemsOnce();
      }
      container.innerHTML = '';
      if (residentRows.length === 0) {
        container.innerHTML = `
          <div class="no-residents">
            <p>利用者が登録されていません</p>
            <p style="font-size:13px;color:#aaa;margin-top:8px">管理者ページから利用者を登録してください</p>
          </div>`;
      } else {
        residentRows.forEach(r => {
          const div = document.createElement('div');
          div.className = 'resident-entry';
          div.dataset.name = r.name;
          div.dataset.residentId = r.id;
          div.innerHTML = `
            <div class="resident-name-label">${escapeHtml(r.name)}</div>
            <textarea placeholder="${escapeHtml(r.name)}の様子を記入（帰宅〜朝の流れ）..."></textarea>
          `;
          renderDiaperStepper(div, r.id);
          renderPersonalItems(div, r.id, r.name);
          container.appendChild(div);
        });
        container.querySelectorAll('textarea').forEach(ta => {
          ta.addEventListener('input', function() { autoExpand(this); scheduleAutoSave(); });
        });
      }

      // マハロ（gh=6）の場合は短期入所枠を追加
      if (parseInt(ghNum) === 6) {
        const section = document.createElement('div');
        section.className = 'short-stay-section';
        section.innerHTML = '<div class="short-stay-title">短期入所</div>';
        [1, 2].forEach(n => {
          const entry = document.createElement('div');
          entry.className = 'short-stay-entry';
          entry.dataset.shortStayKey = `__short_stay_${n}__`;
          entry.innerHTML = `
            <div class="short-stay-name-row">
              <span class="short-stay-label">短期入所${['①','②'][n-1]}</span>
              <input type="text" class="short-stay-name-input" placeholder="氏名を入力">
            </div>
            <textarea placeholder="様子を記入（帰宅〜朝の流れ）..."></textarea>
          `;
          entry.querySelector('input').addEventListener('input', scheduleAutoSave);
          entry.querySelector('textarea').addEventListener('input', function() { autoExpand(this); scheduleAutoSave(); });
          section.appendChild(entry);
        });
        container.appendChild(section);
      }

      // Apply saved report data
      document.getElementById('existing-badge').textContent = reportData ? '記録あり ✓' : '';
      if (reportData) {
        restoreWorkers(reportData);
        const rawShortage = reportData.shortage;
        const shortageArr = typeof rawShortage === 'string' ? JSON.parse(rawShortage || '[]') : (rawShortage || []);
        shortageItems = shortageArr.map(item =>
          typeof item === 'string' ? { text: item, checked: false } : { text: item.text || '', checked: !!item.checked }
        );
        renderShortageList();
        document.querySelectorAll('.resident-entry').forEach(entry => {
          const ta = entry.querySelector('textarea');
          ta.value = (reportData.residents || {})[entry.dataset.name] || '';
          autoExpand(ta);
        });
        // 短期入所枠の復元
        document.querySelectorAll('.short-stay-entry').forEach(entry => {
          const key = entry.dataset.shortStayKey;
          const nameInput = entry.querySelector('input');
          const ta = entry.querySelector('textarea');
          nameInput.value = (reportData.residents || {})[key + 'name'] || '';
          ta.value = (reportData.residents || {})[key] || '';
          autoExpand(ta);
        });
        uploadedPhotos = (reportData.photos || []).map(p => ({ url: p.url, path: p.path }));
        renderPhotoPreview();
      } else {
        restoreWorkers(null);
        shortageItems = [];
        renderShortageList();
        uploadedPhotos = [];
        renderPhotoPreview();
      }
      reportLoadedFor = dateISO;
      setFormInputsDisabled(false);
      setLoadGuardBanner(null);
    }
    bindPhotoInput();
    init();
  </script>
</body>
</html>
