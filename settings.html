<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>利用者設定 - こもれびホーム</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', 'Yu Gothic', sans-serif;
      background: #eef2f7;
      min-height: 100vh;
      padding-bottom: 110px;
    }
    .page-header {
      background: #4a90d9;
      color: white;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .page-header a { color: white; text-decoration: none; font-size: 26px; line-height: 1; }
    .page-header h1 { font-size: 18px; font-weight: bold; }

    .content { padding: 16px; max-width: 680px; margin: 0 auto; }

    .gh-card {
      background: white;
      border-radius: 12px;
      margin-bottom: 12px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .gh-toggle {
      width: 100%;
      background: #f0f6ff;
      border: none;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-family: inherit;
      font-size: 15px;
      font-weight: bold;
      color: #1a2a3a;
      text-align: left;
    }
    .gh-toggle .arrow { transition: transform 0.2s; }
    .gh-toggle.open .arrow { transform: rotate(180deg); }

    .gh-body { display: none; padding: 16px; }
    .gh-body.open { display: block; }

    .resident-list { list-style: none; }

    .resident-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .resident-row input {
      flex: 1;
      padding: 12px 14px;
      border: 1.5px solid #d0d8e8;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      color: #1a2a3a;
    }
    .resident-row input:focus {
      outline: none;
      border-color: #4a90d9;
      box-shadow: 0 0 0 3px rgba(74,144,217,0.15);
    }
    .btn-del {
      flex-shrink: 0;
      width: 40px; height: 40px;
      background: #ffecec;
      color: #e74c3c;
      border: none;
      border-radius: 10px;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
    .btn-del:active { background: #e74c3c; color: white; }

    .btn-add-resident {
      width: 100%;
      padding: 12px;
      background: #f0f6ff;
      border: 2px dashed #4a90d9;
      border-radius: 10px;
      color: #4a90d9;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      margin-top: 4px;
    }
    .btn-add-resident:active { background: #ddeeff; }

    .count-badge {
      background: #4a90d9;
      color: white;
      border-radius: 12px;
      padding: 2px 10px;
      font-size: 12px;
      font-weight: bold;
      min-width: 32px;
      text-align: center;
    }

    .save-footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: white;
      padding: 12px 16px 28px;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.1);
    }
    .btn-save {
      width: 100%;
      padding: 16px;
      background: #2ecc71;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-save:active { background: #27ae60; }
    .save-msg {
      text-align: center;
      height: 22px;
      line-height: 22px;
      color: #2ecc71;
      font-size: 14px;
      font-weight: bold;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="page-header">
    <a href="index.html">←</a>
    <h1>⚙️ 利用者設定</h1>
  </div>

  <div class="content" id="content"></div>

  <div class="save-footer">
    <button class="btn-save" onclick="saveAll()">💾 保存する</button>
    <div class="save-msg" id="saveMsg"></div>
  </div>

  <script>
    const GH_NAMES = [
      'こもれびホーム３−２',
      'こもれびホーム４',
      'こもれびホーム５−１',
      'こもれびホーム５−２',
      'こもれびホーム６',
      'こもれびホームマハロ'
    ];
    const GH_COUNT = 6;

    function loadSettings() {
      return JSON.parse(localStorage.getItem('ghResidents') || '{}');
    }

    function updateCount(num) {
      const ul = document.getElementById(`list-${num}`);
      const count = ul.querySelectorAll('input').length;
      document.getElementById(`badge-${num}`).textContent = count + '名';
    }

    function addRow(num, value = '') {
      const ul = document.getElementById(`list-${num}`);
      const li = document.createElement('li');
      li.innerHTML = `
        <div class="resident-row">
          <input type="text" placeholder="利用者名（例：浅山さん）"
            value="${value.replace(/"/g,'&quot;')}"
            oninput="updateCount(${num})">
          <button class="btn-del" onclick="this.closest('li').remove();updateCount(${num})">−</button>
        </div>
      `;
      ul.appendChild(li);
      updateCount(num);
      if (!value) li.querySelector('input').focus();
    }

    function toggleCard(num) {
      document.getElementById(`toggle-${num}`).classList.toggle('open');
      document.getElementById(`body-${num}`).classList.toggle('open');
    }

    function buildGHCard(num) {
      const name = GH_NAMES[num - 1];
      const div = document.createElement('div');
      div.className = 'gh-card';
      div.innerHTML = `
        <button class="gh-toggle" id="toggle-${num}" onclick="toggleCard(${num})">
          <span>🏡 ${name}</span>
          <div style="display:flex;align-items:center;gap:8px">
            <span class="count-badge" id="badge-${num}">0名</span>
            <span class="arrow">▼</span>
          </div>
        </button>
        <div class="gh-body" id="body-${num}">
          <ul class="resident-list" id="list-${num}"></ul>
          <button class="btn-add-resident" onclick="addRow(${num})">＋ 利用者を追加</button>
        </div>
      `;
      return div;
    }

    function saveAll() {
      const data = {};
      for (let i = 1; i <= GH_COUNT; i++) {
        const ul = document.getElementById(`list-${i}`);
        data[i] = Array.from(ul.querySelectorAll('input'))
          .map(inp => inp.value.trim())
          .filter(Boolean);
      }
      localStorage.setItem('ghResidents', JSON.stringify(data));
      const msg = document.getElementById('saveMsg');
      msg.textContent = '✓ 保存しました！';
      setTimeout(() => msg.textContent = '', 2500);
    }

    // Init
    const settings = loadSettings();
    const content = document.getElementById('content');
    for (let i = 1; i <= GH_COUNT; i++) {
      content.appendChild(buildGHCard(i));
      (settings[i] || []).forEach(name => addRow(i, name));
    }
    toggleCard(1);
  </script>
</body>
</html>
