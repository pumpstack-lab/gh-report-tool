<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>グループホーム 業務日報</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', 'Yu Gothic', sans-serif;
      background: #eef2f7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
    }
    .header {
      width: 100%;
      max-width: 640px;
      text-align: center;
      margin-bottom: 36px;
    }
    .header h1 {
      font-size: 26px;
      color: #1a2a3a;
      margin-bottom: 8px;
      font-weight: bold;
    }
    .header .date {
      font-size: 16px;
      color: #5a6a7a;
      background: white;
      display: inline-block;
      padding: 6px 20px;
      border-radius: 20px;
      margin-top: 6px;
    }
    .label {
      width: 100%;
      max-width: 640px;
      font-size: 14px;
      color: #7a8a9a;
      margin-bottom: 12px;
      padding-left: 4px;
    }
    .gh-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      width: 100%;
      max-width: 640px;
    }
    .gh-btn {
      background: white;
      border: 2px solid #4a90d9;
      border-radius: 16px;
      padding: 28px 16px;
      text-align: center;
      text-decoration: none;
      color: #1a2a3a;
      font-size: 20px;
      font-weight: bold;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .gh-btn:hover, .gh-btn:active {
      background: #4a90d9;
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(74,144,217,0.3);
    }
    .gh-btn .icon { font-size: 36px; }
    .gh-btn .sub { font-size: 13px; color: #7a8a9a; font-weight: normal; }
    .gh-btn:hover .sub, .gh-btn:active .sub { color: rgba(255,255,255,0.8); }
    .settings-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      max-width: 640px;
      margin-top: 20px;
      padding: 14px;
      background: white;
      border: 2px solid #d0d8e8;
      border-radius: 12px;
      color: #5a6a7a;
      text-decoration: none;
      font-size: 15px;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      transition: all 0.15s;
    }
    .settings-link:hover, .settings-link:active {
      background: #f0f6ff;
      border-color: #4a90d9;
      color: #4a90d9;
    }
    footer {
      margin-top: 28px;
      font-size: 12px;
      color: #aab;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🏠 グループホーム 業務日報</h1>
    <span class="date" id="today"></span>
  </div>

  <p class="label">報告するグループホームを選択してください</p>

  <div class="gh-grid">
    <a href="report.html?gh=1" class="gh-btn">
      <span class="icon">🏡</span>
      <span>グループホーム 1</span>
      <span class="sub">ユニット 1</span>
    </a>
    <a href="report.html?gh=2" class="gh-btn">
      <span class="icon">🏡</span>
      <span>グループホーム 2</span>
      <span class="sub">ユニット 2</span>
    </a>
    <a href="report.html?gh=3" class="gh-btn">
      <span class="icon">🏡</span>
      <span>グループホーム 3</span>
      <span class="sub">ユニット 3</span>
    </a>
    <a href="report.html?gh=4" class="gh-btn">
      <span class="icon">🏡</span>
      <span>グループホーム 4</span>
      <span class="sub">ユニット 4</span>
    </a>
    <a href="report.html?gh=5" class="gh-btn">
      <span class="icon">🏡</span>
      <span>グループホーム 5</span>
      <span class="sub">ユニット 5</span>
    </a>
    <a href="report.html?gh=6" class="gh-btn">
      <span class="icon">🏡</span>
      <span>グループホーム 6</span>
      <span class="sub">ユニット 6</span>
    </a>
  </div>

  <a href="settings.html" class="settings-link">⚙️ 利用者設定（名前・人数の登録）</a>

  <footer>業務日報システム v0.2（仮）</footer>

  <script>
    const now = new Date();
    const days = ['日','月','火','水','木','金','土'];
    document.getElementById('today').textContent =
      `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日（${days[now.getDay()]}）`;
  </script>
</body>
</html>
