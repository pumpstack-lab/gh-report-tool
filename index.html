<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>こもれびホーム 業務日報</title>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', 'Yu Gothic', sans-serif;
      background: #eef2f7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
    }
    .header {
      width: 100%;
      max-width: 640px;
      text-align: center;
      margin-bottom: 28px;
    }
    .header h1 {
      font-size: 24px;
      color: #1a2a3a;
      margin-bottom: 8px;
      font-weight: bold;
    }
    .date-wrap {
      position: relative;
      display: inline-block;
      margin-top: 6px;
    }
    .header .date {
      font-size: 15px;
      color: #5a6a7a;
      background: white;
      display: inline-block;
      padding: 6px 20px;
      border-radius: 20px;
      cursor: pointer;
      user-select: none;
      pointer-events: none;
    }
    .header .date:active { background: #e8f0fe; }
    .date-hint {
      font-size: 11px;
      color: #aab;
      margin-top: 4px;
      pointer-events: none;
    }
    #index-date {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      border: 0;
      cursor: pointer;
      z-index: 10;
    }
    .label {
      width: 100%;
      max-width: 640px;
      font-size: 14px;
      color: #7a8a9a;
      margin-bottom: 12px;
      padding-left: 4px;
    }
    .gh-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      width: 100%;
      max-width: 640px;
    }
    .gh-btn {
      background: white;
      border: 2px solid #4a90d9;
      border-radius: 16px;
      padding: 24px 12px;
      text-align: center;
      text-decoration: none;
      color: #1a2a3a;
      font-size: 15px;
      font-weight: bold;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      line-height: 1.4;
    }
    .gh-btn:hover, .gh-btn:active {
      background: #4a90d9;
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(74,144,217,0.3);
    }
    .gh-btn .icon { font-size: 30px; }
    .gh-btn .badge {
      font-size: 11px;
      color: #aaa;
      font-weight: normal;
    }
    .gh-btn:hover .badge, .gh-btn:active .badge { color: rgba(255,255,255,0.7); }

    .sub-links {
      width: 100%;
      max-width: 640px;
      margin-top: 16px;
      display: flex;
      gap: 12px;
    }
    .sub-link {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 13px;
      background: white;
      border: 2px solid #d0d8e8;
      border-radius: 12px;
      color: #5a6a7a;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      transition: all 0.15s;
    }
    .sub-link:hover, .sub-link:active {
      background: #f0f6ff;
      border-color: #4a90d9;
      color: #4a90d9;
    }
    footer {
      margin-top: 28px;
      font-size: 12px;
      color: #aab;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🏠 こもれびホーム 業務日報</h1>
    <div class="date-wrap" id="date-wrap">
      <span class="date" id="today"></span>
      <div class="date-hint">クリックで日付変更</div>
      <input type="date" id="index-date">
    </div>
  </div>

  <p class="label">報告するホームを選択してください</p>

  <div class="gh-grid">
    <a href="report.html?gh=1" class="gh-btn" id="btn1">
      <span class="icon">🏡</span>
      <span>こもれびホーム３−２</span>
      <span class="badge" id="badge1"></span>
    </a>
    <a href="report.html?gh=2" class="gh-btn" id="btn2">
      <span class="icon">🏡</span>
      <span>こもれびホーム４</span>
      <span class="badge" id="badge2"></span>
    </a>
    <a href="report.html?gh=3" class="gh-btn" id="btn3">
      <span class="icon">🏡</span>
      <span>こもれびホーム５−１</span>
      <span class="badge" id="badge3"></span>
    </a>
    <a href="report.html?gh=4" class="gh-btn" id="btn4">
      <span class="icon">🏡</span>
      <span>こもれびホーム５−２</span>
      <span class="badge" id="badge4"></span>
    </a>
    <a href="report.html?gh=5" class="gh-btn" id="btn5">
      <span class="icon">🏡</span>
      <span>こもれびホーム６</span>
      <span class="badge" id="badge5"></span>
    </a>
    <a href="report.html?gh=6" class="gh-btn" id="btn6">
      <span class="icon">🏡</span>
      <span>こもれびホームマハロ</span>
      <span class="badge" id="badge6"></span>
    </a>
  </div>

  <div class="sub-links">
    <a href="history.html" class="sub-link">📋 過去記録</a>
    <a href="admin.html" class="sub-link">🔐 管理者ログイン</a>
  </div>

  <footer>こもれびホーム 業務日報システム v0.3</footer>

  <script>
    function todayISO() {
      const t = new Date();
      return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
    }
    function formatDate(iso) {
      const [y, m, d] = iso.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      const days = ['日','月','火','水','木','金','土'];
      return `${y}年${m}月${d}日（${days[dt.getDay()]}）`;
    }
    function updateGHLinks(dateISO) {
      for (let i = 1; i <= 6; i++) {
        const btn = document.getElementById(`btn${i}`);
        if (btn) btn.href = `report.html?gh=${i}&date=${dateISO}`;
      }
    }

    const indexDateEl = document.getElementById('index-date');
    let selectedDate = todayISO();
    indexDateEl.value = selectedDate;
    document.getElementById('today').textContent = formatDate(selectedDate);
    updateGHLinks(selectedDate);

    // date-wrapクリック → showPicker()でPC/iOS両対応
    document.getElementById('date-wrap').addEventListener('click', () => {
      try { indexDateEl.showPicker(); } catch(e) {}
    });

    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function updateBadges(dateStr) {
      // バッジをいったん全リセット
      for (let i = 1; i <= 6; i++) {
        const badge = document.getElementById(`badge${i}`);
        if (badge) { badge.textContent = ''; }
      }
      db.from('reports')
        .select('gh_num')
        .eq('report_date', dateStr)
        .then(({ data }) => {
          if (!data) return;
          data.forEach(r => {
            const badge = document.getElementById(`badge${r.gh_num}`);
            if (badge) {
              badge.textContent = dateStr === todayISO() ? '本日記録あり ✓' : '記録あり ✓';
              badge.style.color = '#2ecc71';
            }
          });
        });
    }

    indexDateEl.addEventListener('change', () => {
      selectedDate = indexDateEl.value;
      document.getElementById('today').textContent = formatDate(selectedDate);
      updateGHLinks(selectedDate);
      updateBadges(selectedDate);
    });

    // 初期表示：今日のバッジ
    updateBadges(selectedDate);
  </script>
</body>
</html>
