<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>過去記録 - こもれびホーム</title>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', 'Yu Gothic', sans-serif;
      background: #eef2f7;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    .page-header {
      background: #4a90d9;
      color: white;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .page-header a { color: white; text-decoration: none; font-size: 26px; }
    .page-header h1 { font-size: 18px; font-weight: bold; }

    .tabs-wrap {
      background: white;
      border-bottom: 1px solid #dde;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      white-space: nowrap;
      position: sticky;
      top: 52px;
      z-index: 90;
    }
    .tabs-wrap::-webkit-scrollbar { display: none; }
    .tabs {
      display: inline-flex;
      padding: 0 12px;
    }
    .tab-btn {
      display: inline-block;
      padding: 12px 14px;
      font-size: 13px;
      font-weight: bold;
      color: #7a8a9a;
      cursor: pointer;
      border: none;
      background: none;
      font-family: inherit;
      border-bottom: 3px solid transparent;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .tab-btn.active {
      color: #4a90d9;
      border-bottom-color: #4a90d9;
    }

    .content { padding: 16px; max-width: 680px; margin: 0 auto; }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #aaa;
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 15px; }
    .empty-state a {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 24px;
      background: #4a90d9;
      color: white;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
    }

    .loading-state {
      text-align: center;
      padding: 60px 20px;
      color: #aaa;
      font-size: 15px;
    }

    .report-card {
      background: white;
      border-radius: 12px;
      margin-bottom: 12px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      cursor: pointer;
      transition: all 0.15s;
    }
    .report-card:active { transform: scale(0.98); box-shadow: 0 1px 4px rgba(0,0,0,0.1); }

    .card-head {
      padding: 14px 16px 10px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .card-date {
      font-size: 16px;
      font-weight: bold;
      color: #1a2a3a;
      line-height: 1.3;
    }
    .card-meta {
      font-size: 12px;
      color: #7a8a9a;
      margin-top: 4px;
    }
    .card-arrow {
      font-size: 18px;
      color: #4a90d9;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .card-preview {
      padding: 0 16px 14px;
      font-size: 13px;
      color: #5a6a7a;
      line-height: 1.6;
      border-top: 1px solid #f0f2f5;
      margin-top: 2px;
      padding-top: 10px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      display: flex;
      align-items: flex-end;
    }
    .modal-box {
      background: white;
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
    }
    .modal-head {
      padding: 16px 20px;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .modal-head h2 { font-size: 15px; font-weight: bold; line-height: 1.4; }
    .modal-actions { display: flex; align-items: center; gap: 10px; }
    .btn-edit {
      padding: 8px 16px;
      background: #4a90d9;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      display: inline-block;
    }
    .btn-close {
      background: #f0f0f0;
      border: none;
      border-radius: 50%;
      width: 32px; height: 32px;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      -webkit-overflow-scrolling: touch;
    }

    .d-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 18px; }
    .d-table td { border: 1.5px solid #333; padding: 8px 10px; vertical-align: middle; }
    .d-gh-name { text-align: center; font-size: 16px; font-weight: bold; }
    .d-sig-head { text-align: center; font-size: 11px; color: #555; background: #f8f8f8; }
    .d-sig-box { height: 40px; }
    .d-sec-title {
      font-weight: bold; font-size: 14px;
      margin: 16px 0 10px;
      padding: 6px 12px;
      background: #f0f6ff;
      border-left: 4px solid #4a90d9;
      border-radius: 0 6px 6px 0;
    }
    .d-resident { margin-bottom: 14px; }
    .d-resident .r-name { font-weight: bold; font-size: 14px; margin-bottom: 4px; }
    .d-resident .r-name::before { content: '・'; color: #4a90d9; }
    .d-resident .r-text {
      font-size: 13px; line-height: 1.8; white-space: pre-wrap;
      background: #f9f9f9; padding: 10px 14px; border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="page-header">
    <a href="index.html">←</a>
    <h1>📋 過去記録</h1>
  </div>

  <div class="tabs-wrap">
    <div class="tabs" id="tabs"></div>
  </div>

  <div class="content" id="content"></div>

  <div id="modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeModal()">
    <div class="modal-box">
      <div class="modal-head">
        <h2 id="modal-title">記録</h2>
        <div class="modal-actions">
          <a id="btn-edit" class="btn-edit" href="#">編集する</a>
          <button class="btn-close" onclick="closeModal()">✕</button>
        </div>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script>
    const GH_NAMES = [
      'こもれびホーム３−２',
      'こもれびホーム４',
      'こもれびホーム５−１',
      'こもれびホーム５−２',
      'こもれびホーム６',
      'こもれびホームマハロ'
    ];

    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function getReiwaDate(isoDate) {
      const [y, m, d] = isoDate.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      const reiwa = y - 2018;
      const days = ['日','月','火','水','木','金','土'];
      return `令和${reiwa}年${m}月${d}日（${days[dt.getDay()]}）`;
    }

    let currentGH = '1';

    const tabsEl = document.getElementById('tabs');
    GH_NAMES.forEach((name, i) => {
      const ghNum = String(i + 1);
      const btn = document.createElement('button');
      btn.className = 'tab-btn' + (ghNum === '1' ? ' active' : '');
      btn.textContent = name;
      btn.onclick = () => selectGH(ghNum);
      btn.id = `tab-${ghNum}`;
      tabsEl.appendChild(btn);
    });

    function selectGH(ghNum) {
      currentGH = ghNum;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`tab-${ghNum}`).classList.add('active');
      loadList(ghNum);
    }

    async function loadList(ghNum) {
      const content = document.getElementById('content');
      content.innerHTML = '<div class="loading-state">読み込み中...</div>';

      const { data, error } = await db.from('reports').select('*')
        .eq('gh_num', parseInt(ghNum))
        .order('report_date', { ascending: false })
        .limit(60);

      if (error) {
        content.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>読み込みに失敗しました<br>${error.message}</p></div>`;
        return;
      }

      if (!data || data.length === 0) {
        content.innerHTML = `
          <div class="empty-state">
            <div class="icon">📭</div>
            <p>まだ記録がありません</p>
            <a href="report.html?gh=${ghNum}">このホームの日報を記入する</a>
          </div>
        `;
        return;
      }

      content.innerHTML = '';
      data.forEach(report => {
        const dateISO = report.report_date;
        const residents = Object.entries(report.residents || {});
        const filledCount = residents.filter(([, v]) => v && v.trim()).length;
        const firstEntry = residents.find(([, v]) => v && v.trim());
        const preview = firstEntry
          ? `・${firstEntry[0]}：${firstEntry[1].slice(0, 60)}...`
          : '（記録なし）';

        const card = document.createElement('div');
        card.className = 'report-card';
        card.innerHTML = `
          <div class="card-head">
            <div>
              <div class="card-date">${getReiwaDate(dateISO)}</div>
              <div class="card-meta">報告者: ${report.reporter || '未記入'} ｜ ${filledCount}名記録済み</div>
            </div>
            <span class="card-arrow">›</span>
          </div>
          <div class="card-preview">${preview}</div>
        `;
        card.onclick = () => showDetail(ghNum, dateISO, report);
        content.appendChild(card);
      });
    }

    function showDetail(ghNum, dateISO, report) {
      const ghName = GH_NAMES[parseInt(ghNum) - 1];
      const dateStr = getReiwaDate(dateISO);
      const reporter = report.reporter || '（未記入）';
      const residents = report.residents || {};

      document.getElementById('modal-title').textContent = `${ghName} ${dateStr}`;
      document.getElementById('btn-edit').href = `report.html?gh=${ghNum}&date=${dateISO}`;

      let entriesHTML = '';
      Object.entries(residents).forEach(([name, text]) => {
        entriesHTML += `
          <div class="d-resident">
            <div class="r-name">${name}</div>
            <div class="r-text">${text || '（未入力）'}</div>
          </div>
        `;
      });

      document.getElementById('modal-body').innerHTML = `
        <table class="d-table">
          <tr>
            <td rowspan="2" style="width:34%">
              <div style="font-weight:bold;font-size:14px;margin-bottom:4px">報告書</div>
              <div style="font-size:12px;color:#444">${dateStr}</div>
            </td>
            <td rowspan="2" class="d-gh-name">${ghName}</td>
            <td class="d-sig-head">管理者</td>
            <td class="d-sig-head">サービス管理責任者</td>
            <td class="d-sig-head">報告者</td>
          </tr>
          <tr>
            <td class="d-sig-box"></td>
            <td class="d-sig-box"></td>
            <td style="font-size:14px;font-weight:bold;padding:8px">${reporter}</td>
          </tr>
        </table>
        <div class="d-sec-title">【特記事項】</div>
        ${entriesHTML || '<p style="color:#999;font-size:13px">（記録なし）</p>'}
        <div style="height:20px"></div>
      `;

      document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }

    loadList('1');
  </script>
</body>
</html>
